<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Build Yourself</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<meta name="apple-mobile-web-app-title" content="Build Yourself">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Dein persönliches Self-Improvement-System: 66-Tage-Arcs, Daily Quests, Level und Ränge.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: one phone column (max 480px), fixed bottom nav. Every surface is a "system window"; pop-ups are system messages. Single deliberate dark world in ice blue. */
:root{
  --void:#070a12;
  --panel:#0b1220;
  --panel2:#111a2e;
  --edge:#1c2e4c;
  --ice:#82c8ff;
  --ice-dim:#3d6fa6;
  --ice-glow:rgba(130,200,255,.14);
  --text:#e7eefb;
  --mute:#8797b6;
  --faint:#3f4d69;
  --gold:#f2c46d;
  --red:#ff6b6b;
  --green:#6fe3a5;
  --violet:#b48cff;
  --teal:#5fd4d4;
  --ember:#ff9a6b;
  --on-ice:#06101f;
  --f-sys:"Chakra Petch","Rajdhani",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--void);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(110% 45% at 50% -8%,rgba(130,200,255,.13),transparent 62%),radial-gradient(60% 40% at 100% 100%,rgba(180,140,255,.05),transparent 70%)}
#root{position:relative;z-index:1}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;padding:0}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--text);background:#0a1426;border:1px solid var(--edge);border-radius:6px;padding:11px 12px;width:100%}
textarea{min-height:72px;resize:vertical}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sys{font-family:var(--f-sys)}
.label{font:600 10.5px/1.3 var(--f-sys);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--mute)}
.ice{color:var(--ice)}
.err{color:var(--red);font-size:13px}

/* System window */
.win{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:6px;padding:16px;box-shadow:inset 0 0 0 1px rgba(130,200,255,.03),0 10px 30px rgba(0,0,0,.35)}
.win.sys{border-color:var(--ice-dim);box-shadow:0 0 26px var(--ice-glow),inset 0 0 22px rgba(130,200,255,.05)}
.win.sys::before,.win.sys::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--ice);pointer-events:none}
.win.sys::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.win.sys::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.win.red{border-color:rgba(255,107,107,.55);box-shadow:0 0 26px rgba(255,107,107,.12)}
.win.red::before,.win.red::after{border-color:var(--red)}
.win-h{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--f-sys);letter-spacing:.22em;text-transform:uppercase;color:var(--ice);margin-bottom:12px}
.win-h::before{content:"";width:6px;height:6px;background:currentColor;transform:rotate(45deg);box-shadow:0 0 8px currentColor;flex:none}
.win-h .r{margin-left:auto;font-family:var(--f-mono);letter-spacing:.06em;color:var(--mute)}
.win.red .win-h{color:var(--red)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:6px;font:700 13px/1 var(--f-sys);letter-spacing:.16em;text-transform:uppercase;text-align:center}
.btn-ice{background:var(--ice);color:var(--on-ice);box-shadow:0 0 18px rgba(130,200,255,.35)}
.btn-ice:active{filter:brightness(.92)}
.btn-ghost{border:1px solid var(--edge);color:var(--text)}
.btn-ghost:hover{border-color:var(--ice-dim)}
.btn-red{border:1px solid var(--red);color:var(--red)}
.btn-block{width:100%}
.link{color:var(--ice);font-size:13px;min-height:44px;display:inline-flex;align-items:center}
.chip{min-height:42px;padding:8px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--panel);font-size:14px;line-height:1.2}
.chip[aria-pressed="true"]{border-color:var(--ice);color:var(--ice);background:rgba(130,200,255,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:block;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);font-size:14.5px}
.opt[aria-pressed="true"]{border-color:var(--ice);background:rgba(130,200,255,.08);color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--edge);border-radius:4px;font:600 11px/1.2 var(--f-sys);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tag.ice{border-color:var(--ice-dim);color:var(--ice)}
.tag.red{border-color:rgba(255,107,107,.6);color:var(--red)}
.tag.gold{border-color:rgba(242,196,109,.6);color:var(--gold)}
.tag.green{border-color:rgba(111,227,165,.6);color:var(--green)}

.bar{height:6px;background:#0a1426;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ice-dim),var(--ice));box-shadow:0 0 10px var(--ice)}
.bar.thin{height:4px}
.bar.green>i{background:var(--green);box-shadow:0 0 8px var(--green)}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.day{font:700 40px/1 var(--f-sys);letter-spacing:.04em}
.day small{font-size:18px;color:var(--mute);margin-left:2px}
.hud-r{display:flex;flex-direction:column;align-items:center;gap:4px}
.lv{font:700 12px/1 var(--f-sys);letter-spacing:.18em;color:var(--mute)}
.xprow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.xprow .mono{font-size:11.5px;color:var(--mute)}
.gear{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--mute);margin-left:auto}
.gear svg{width:20px;height:20px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 10px/1 var(--f-sys);color:var(--mute);letter-spacing:.1em}
.wd i{width:100%;max-width:34px;height:8px;border-radius:2px;background:#0a1426;border:1px solid var(--edge)}
.wd.ok i{background:var(--green);border-color:var(--green);box-shadow:0 0 6px rgba(111,227,165,.6)}
.wd.miss i{background:rgba(255,107,107,.35);border-color:rgba(255,107,107,.6)}
.wd.rest i{border-color:var(--ice-dim);background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(130,200,255,.25) 3px 5px)}
.wd.today i{border-color:var(--ice);box-shadow:0 0 6px var(--ice)}
.wd.today{color:var(--ice)}

/* Quest rows */
.qlist{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border-top:1px solid rgba(29,48,80,.7);padding:4px 0}
.qrow:first-child{border-top:0}
.qmain{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;min-height:56px;padding:6px 0;width:100%}
.qstat{width:36px;height:36px;display:grid;place-items:center;font:700 10px/1 var(--f-sys);letter-spacing:.06em;color:var(--c);border:1px solid color-mix(in oklab,var(--c) 55%,transparent);border-radius:4px;background:color-mix(in oklab,var(--c) 10%,transparent);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.qtext{display:flex;flex-direction:column;gap:3px;min-width:0}
.qtext b{font-weight:700;font-size:15px;line-height:1.25}
.qtext small{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.qxp{font:600 12px/1 var(--f-mono);color:var(--ice)}
.qrow.done .qtext b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--faint)}
.qrow.done .qxp{color:var(--green)}
.qcheck{width:44px;height:44px;display:grid;place-items:center}
.qcheck span{width:26px;height:26px;border:1.5px solid var(--ice-dim);border-radius:4px;display:grid;place-items:center;color:var(--on-ice);font-weight:700}
.qcheck[data-a=q-open][aria-pressed="false"] span{color:var(--ice);font-family:var(--f-mono)}
.qcheck[aria-pressed="true"] span{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(111,227,165,.6)}
.qctl{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:4px 0 12px 50px}
.qctl .row{flex-wrap:wrap;gap:6px}
.qctl .chip{min-height:40px;padding:6px 12px;font-family:var(--f-mono);font-size:13px}
.qctl input{max-width:120px;min-height:40px;padding:8px 10px}
.qrow.pen .qstat{--c:var(--red)}
.foot{margin-top:12px;padding-top:12px;border-top:1px dashed var(--edge);font-size:13px;color:var(--mute)}
.foot b{color:var(--ice)}

/* Rank badge */
.rank{display:block}

/* Cards */
.mcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px 16px;border-radius:8px;border:1px solid var(--rc);background:radial-gradient(120% 80% at 50% 0%,color-mix(in oklab,var(--rc) 18%,var(--panel2)),var(--panel));box-shadow:0 0 22px color-mix(in oklab,var(--rc) 22%,transparent);min-height:150px;text-align:left;width:100%}
.mcard .cat{font:600 10px/1 var(--f-sys);letter-spacing:.22em;text-transform:uppercase;color:var(--rc)}
.mcard b{font:700 19px/1.2 var(--f-sys);letter-spacing:.02em}
.mcard p{font-size:14.5px;line-height:1.55}
.mcard .rar{position:absolute;top:14px;right:14px;font:600 10px/1 var(--f-sys);letter-spacing:.16em;text-transform:uppercase;color:var(--rc)}
.mcard.big{min-height:300px;justify-content:center;padding:28px 22px}
.mcard.big b{font-size:26px}
.mcard.big p{font-size:17px}
.cardback{display:grid;place-items:center;min-height:150px;border-radius:8px;border:1px dashed var(--ice-dim);background:repeating-linear-gradient(135deg,rgba(130,200,255,.04) 0 8px,transparent 8px 16px);font:700 13px/1 var(--f-sys);letter-spacing:.3em;color:var(--ice-dim)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cmini{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:6px;border:1px solid var(--rc);background:linear-gradient(180deg,color-mix(in oklab,var(--rc) 10%,var(--panel2)),var(--panel));min-height:96px;text-align:left;width:100%}
.cmini b{font:700 14px/1.25 var(--f-sys)}
.cmini span{font:600 9.5px/1 var(--f-sys);letter-spacing:.18em;text-transform:uppercase;color:var(--rc)}
.cmini.lock{border-style:dashed;border-color:var(--faint);background:var(--panel);opacity:.6}
.cmini.lock b{color:var(--faint)}
.flip{animation:flip .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes flip{from{transform:rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* Status */
.stat{display:grid;grid-template-columns:44px 1fr 36px;gap:10px;align-items:center;font-size:13.5px}
.stat .code{font:700 11px/1 var(--f-sys);letter-spacing:.1em;color:var(--c)}
.stat .bar>i{background:var(--c);box-shadow:0 0 8px var(--c)}
.stat .mono{text-align:right;color:var(--text)}
.radar{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.grid66{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.grid66 i{aspect-ratio:1;border-radius:2px;background:#0a1426;border:1px solid var(--edge);max-width:100%}
.grid66 i.ok{background:var(--green);border-color:var(--green)}
.grid66 i.miss{background:rgba(255,107,107,.35);border-color:rgba(255,107,107,.6)}
.grid66 i.rest{border-color:var(--ice-dim);background:repeating-linear-gradient(45deg,transparent 0 2px,rgba(130,200,255,.3) 2px 4px)}
.grid66 i.today{border-color:var(--ice);box-shadow:0 0 6px var(--ice)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:14px}
.kv span:nth-child(even){font-family:var(--f-mono);color:var(--ice)}
.ach{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid rgba(29,48,80,.7)}
.ach:first-child{border-top:0}
.ach b{font:700 14px/1.3 var(--f-sys);letter-spacing:.03em}
.ach.lock b{color:var(--faint)}
.ach .note{grid-column:1/-1}

/* Tools */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;flex-direction:column;gap:8px;padding:14px;min-height:118px;border:1px solid var(--edge);border-radius:6px;background:linear-gradient(180deg,var(--panel2),var(--panel));text-align:left;width:100%}
.tool b{font:700 15px/1.2 var(--f-sys);letter-spacing:.04em}
.tool .tv{font:600 13px/1.3 var(--f-mono);color:var(--ice);margin-top:auto}
.tool svg{width:22px;height:22px;color:var(--ice)}
.bigtime{font:700 64px/1 var(--f-mono);text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.breath{width:180px;height:180px;margin:10px auto;border-radius:50%;border:1px solid var(--ice-dim);display:grid;place-items:center;position:relative}
.breath::before{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(130,200,255,.35),rgba(130,200,255,.05));animation:breathe 10s ease-in-out infinite;transform-origin:center}
.breath span{position:relative;font:600 13px/1 var(--f-sys);letter-spacing:.2em;text-transform:uppercase;color:var(--ice)}
@keyframes breathe{0%{transform:scale(.45)}40%{transform:scale(1)}100%{transform:scale(.45)}}
.hist{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.hist .mono{color:var(--ice);font-size:12.5px}
.bars7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px;position:relative;border-bottom:1px solid var(--edge);margin-bottom:22px}
.bars7 .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.bars7 .b{width:70%;border-radius:3px 3px 0 0;background:var(--ice-dim);min-height:2px}
.bars7 .b.ok{background:var(--green)}
.bars7 .l{position:absolute;bottom:-18px;font:600 10px/1 var(--f-sys);color:var(--mute)}
.bars7 .v{font:500 10px/1 var(--f-mono);color:var(--mute);margin-bottom:4px}
.bars7 .lim{position:absolute;left:0;right:0;border-top:1px dashed var(--gold)}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.glass{height:40px;border:1.5px solid var(--edge);border-radius:3px 3px 9px 9px;background:#0a1426}
.glass[aria-pressed="true"]{border-color:var(--teal);background:linear-gradient(transparent 22%,rgba(95,212,212,.45) 22%)}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(7,10,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:600 10px/1 var(--f-sys);letter-spacing:.12em;color:var(--mute)}
.nav button svg{width:20px;height:20px}
.nav button[aria-current="page"]{color:var(--ice);text-shadow:0 0 10px rgba(130,200,255,.6)}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--void);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.close{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end;font:600 11px/1 var(--f-sys);letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.h1{font:700 26px/1.15 var(--f-sys);letter-spacing:.02em}
.prose{font-size:15px;line-height:1.65;max-width:62ch}

/* Overlay = system pop-up */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px 16px;background:rgba(3,6,12,.86);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ov{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;animation:pop .45s cubic-bezier(.2,.7,.2,1) both}
.ov .win{padding:22px 18px}
.ov-title{font:700 22px/1.2 var(--f-sys);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.ov-big{font:700 76px/1 var(--f-sys);text-align:center;color:var(--ice);text-shadow:0 0 24px rgba(130,200,255,.6)}
.ov-lines{display:flex;flex-direction:column;gap:6px;text-align:center;font-size:14.5px}
.ov-rows{display:flex;flex-direction:column}
.ov-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 2px;border-top:1px solid var(--edge);font-size:14px}
.ov-row span:last-child{font-family:var(--f-mono);color:var(--ice)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

/* Onboarding */
.onb{display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 40px)}
.dots{display:flex;gap:5px}
.dots i{height:3px;flex:1;border-radius:2px;background:var(--edge)}
.dots i.on{background:var(--ice);box-shadow:0 0 6px var(--ice)}
.qblock{display:flex;flex-direction:column;gap:8px}
.qblock h2{font-size:16px;font-weight:700;line-height:1.35}
.sticky{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--void) 30%);display:flex;flex-direction:column;gap:6px}
.pick{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);text-align:left}
.pick[aria-pressed="true"]{border-color:var(--ice);background:rgba(130,200,255,.07)}
.pick b{font-weight:700;font-size:14.5px;display:block}
.pick small{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.pick .box{width:22px;height:22px;border:1.5px solid var(--ice-dim);border-radius:4px;display:grid;place-items:center;font-size:13px;color:var(--on-ice)}
.pick[aria-pressed="true"] .box{background:var(--ice);border-color:var(--ice)}
.mode{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);text-align:left;width:100%}
.mode[aria-pressed="true"]{border-color:var(--ice);box-shadow:0 0 18px var(--ice-glow)}
.mode.hard[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 18px rgba(255,107,107,.15)}
.mode b{font:700 18px/1.2 var(--f-sys);letter-spacing:.08em;text-transform:uppercase}
.syswrite{font:600 15px/1.6 var(--f-sys);letter-spacing:.03em}

/* Toast */

</style></head><body>

<div id="root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ==== 10_core.js ==== */

"use strict";
/* ============================================================
   CORE: utilities, state, persistence, lock, shell
   ============================================================ */
const ACTIONS={},SHEETS={},FORMS={};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z2=n=>String(n).padStart(2,'0');
function todayKey(d=new Date()){return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function shiftDay(k,n){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return todayKey(d)}
function fmtDate(k){return new Date(k+'T12:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short'})}
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function wdOf(k){return new Date(k+'T12:00:00').getDay()}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(seed);return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rand(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
const pick=(arr,r)=>arr[Math.floor((r?r():rand())*arr.length)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const sumBy=(arr,k)=>arr.reduce((a,x)=>a+(+x[k]||0),0);
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtN=n=>Math.round(n).toLocaleString('de-DE');

/* ---------- state ---------- */
const LS='reset66.v1',OLD_LS='build-yourself.v1';
function fresh(){return{v:1,savedAt:0,onboarded:false,lock:null,profile:null,start:null,cycle:1,hard:false,
  stats:{STR:5,END:5,VIT:5,INT:5,FOC:5,WIL:5},xp:0,quests:[],log:{},evalUntil:null,best:0,returnBonus:false,penCarry:null,lastPhase:null,cycleDone:false,
  arcs:{active:null,ext:0,ch:[],examPassed:null,examDay:null,done:{},runs:[],chTotal:0},cards:{},dups:0,ach:{},titles:[],title:null,hist:[],notices:[],flags:{},seen:{},chat:[],chatDay:null,
  tools:{focus:{run:null,log:[]},med:{run:null,log:[]},food:{weight:null,kcal:null,days:{}},train:[],read:{books:[],log:[]},screen:{},journal:[]}}}
function migrate(s){const f=fresh();for(const k in f){if(s[k]===undefined)s[k]=f[k];else if(f[k]&&typeof f[k]==='object'&&!Array.isArray(f[k])&&s[k]&&typeof s[k]==='object'){for(const kk in f[k])if(s[k][kk]===undefined)s[k][kk]=f[k][kk]}}return s}
function loadLocal(){try{const j=localStorage.getItem(LS);if(j)return migrate(JSON.parse(j))}catch(e){}return null}
let S=loadLocal()||fresh();
const ui={unlocked:false,lockErr:'',tab:'today',sheet:null,ov:[],confirm:null,qOpen:null,sync:'local',pwMsg:'',backup:null,cardCat:'all',
  onb:{step:0,name:'',goals:[],a:{},time:null,err:'',lock:null,sel:null,hard:false}};

const cloud={ref:null,writing:false,dirty:false,timer:null,retried:false};
function save(){S.savedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}cloudSave(false)}
function cloudSave(now){if(!cloud.ref)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(flush,now?0:1200)}
async function flush(){
  if(!cloud.ref)return;if(cloud.writing){cloud.dirty=true;return}
  cloud.writing=true;ui.sync='saving';updSync();
  try{await cloud.ref.set({json:JSON.stringify(S),savedAt:S.savedAt});ui.sync='synced';cloud.retried=false}
  catch(e){if(e&&e.code==='unavailable'&&!cloud.retried){cloud.retried=true;setTimeout(flush,1500+rand()*1500);ui.sync='saving'}else ui.sync='local'}
  cloud.writing=false;updSync();if(cloud.dirty){cloud.dirty=false;flush()}
}
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){ui.sync='local';updSync();return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){ui.sync='local';updSync();return}
    const uid=await user.id();if(!uid){ui.sync='local';updSync();return}
    cloud.ref=db.doc('data/users/'+uid+'/reset66');
    const snap=await cloud.ref.get();let remoteAt=0;
    if(snap.exists){const d=snap.data()||{};remoteAt=d.savedAt||0;
      if(remoteAt>(S.savedAt||0)){let r=null;try{r=JSON.parse(d.json)}catch(e){}if(r){S=migrate(r);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}ui.sync='synced';render();return}}}
    ui.sync='synced';if(S.savedAt>remoteAt)cloudSave(true);updSync();
  }catch(e){ui.sync='local';updSync()}
}
function updSync(){const el=document.getElementById('sync');if(el)el.textContent=syncLabel()}
function syncLabel(){return{synced:'Gesichert in deinem Claude-Konto und in diesem Browser.',saving:'Speichert …',local:'Gespeichert auf diesem Gerät. Mach regelmäßig ein Backup.'}[ui.sync]||''}

/* ---------- lock ---------- */
function newSalt(){try{const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return String(Math.random()).slice(2)+Date.now()}}
async function hashPw(pw,salt){const data=new TextEncoder().encode(salt+'|'+pw);try{let b=await crypto.subtle.digest('SHA-256',data);for(let i=0;i<999;i++)b=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'f'+hash(salt+'|'+pw).toString(16)}}
async function makeLock(pw){const salt=newSalt();return{salt,hash:await hashPw(pw,salt)}}
function encodeBackup(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function decodeBackup(code){return migrate(JSON.parse(decodeURIComponent(escape(atob(code.trim())))))}
function renderLock(){
  return `<main class="app onb" style="padding-top:calc(72px + env(safe-area-inset-top,0px))">
    <div class="label ice">[ System ]</div>
    <h1 class="h1">Willkommen zurück${S.profile&&S.profile.name?', '+esc(S.profile.name):''}.</h1>
    <form id="lockform" class="win sys stack" autocomplete="off">
      <div class="win-h">Identität bestätigen</div>
      <label class="label" for="lock-pw">Passwort</label>
      <input id="lock-pw" type="password" autocomplete="current-password">
      ${ui.lockErr?`<p class="err" role="alert">${esc(ui.lockErr)}</p>`:''}
      <button class="btn btn-ice btn-block" type="submit">Entsperren</button>
    </form>
    ${ui.confirm==='forgot'?`<div class="win red stack"><p class="small">Ohne Passwort lässt sich dein Fortschritt nicht öffnen. Du kannst nur neu beginnen – dabei wird alles in diesem Browser gelöscht. Mit einem Backup-Code kannst du danach alles zurückholen.</p><div class="row wrap"><button class="btn btn-red" data-a="forgot-yes">Alles löschen</button><button class="btn btn-ghost" data-a="confirm-no">Abbrechen</button></div></div>`
      :`<button class="link" data-a="forgot-ask" style="justify-content:center">Passwort vergessen?</button>`}
  </main>`;
}
FORMS.lockform=async()=>{const pw=(document.getElementById('lock-pw')||{}).value||'';
  if(await hashPw(pw,S.lock.salt)===S.lock.hash){ui.unlocked=true;ui.lockErr='';ui.confirm=null;render()}else{ui.lockErr='Falsches Passwort.';render()}};
ACTIONS['forgot-ask']=()=>{ui.confirm='forgot';render()};
ACTIONS['forgot-yes']=()=>{S=fresh();ui.confirm=null;ui.unlocked=false;ui.lockErr='';ui.onb={step:0,name:'',goals:[],a:{},time:null,err:'',lock:null,sel:null,hard:false};save();render()};
ACTIONS['confirm-no']=()=>{ui.confirm=null;keepScroll(render)};

/* ---------- toast & helpers ---------- */
function toast(html){const box=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';el.innerHTML=html;box.appendChild(el);setTimeout(()=>el.remove(),3000)}
function keepScroll(fn){const sc=document.querySelector('.sheet');const top=sc?sc.scrollTop:0;const wy=window.scrollY;fn();const sc2=document.querySelector('.sheet');if(sc2)sc2.scrollTop=top;else window.scrollTo(0,wy)}
function sheetWrap(inner,cls){return `<div class="sheet ${cls||''}" role="dialog" aria-modal="true"><div class="sheet-in">${inner}</div></div>`}
function closeBtn(label){return `<div class="sheet-top"><span class="label ice">[ System ]</span><button class="close" data-a="close">${label||'Schließen'}</button></div>`}
ACTIONS.close=()=>{ui.sheet=null;ui.confirm=null;ui.backup=null;ui.pwMsg='';render()};

/* ---------- shell ---------- */
const root=document.getElementById('root');
const NAV_ICONS={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M18 16l2 2 3-4" /></svg>',
  status:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 8l4 2.2v4.6L12 17l-4-2.2v-4.6z"/></svg>',
  tools:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>',
  arcs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19c3-9 13-9 16 0"/><path d="M8 19c1.5-4 6.5-4 8 0"/><circle cx="12" cy="6" r="2"/></svg>',
  sensei:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="3" width="12" height="17" rx="1.5"/><path d="M3 6v13a2 2 0 0 0 2 2h10"/></svg>'
};
function renderNav(){
  const items=[['today','HEUTE'],['sensei','SENSEI'],['arcs','ARCS'],['status','STATUS'],['tools','TOOLS'],['cards','KARTEN']];
  return `<nav class="nav" aria-label="Hauptnavigation"><div class="nav-in">${items.map(([k,l])=>`<button data-a="tab" data-t="${k}" ${ui.tab===k?'aria-current="page"':''}>${NAV_ICONS[k]}${l}</button>`).join('')}</div></nav>`;
}
ACTIONS.tab=ds=>{ui.tab=ds.t;ui.confirm=null;ui.qOpen=null;render();window.scrollTo(0,0)};
const GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';

function render(){
  if(S.onboarded&&S.lock&&!ui.unlocked){root.innerHTML=renderLock();document.body.style.overflow='';const f=document.getElementById('lock-pw');if(f)f.focus();return}
  if(S.onboarded){ensureArc();evaluateDays()}
  let h;
  if(!S.onboarded)h=renderOnboarding();
  else{const tabs={today:renderToday,sensei:renderChat,arcs:renderArcs,status:renderStatus,tools:renderTools,cards:renderCards};h=`<main class="app">${(tabs[ui.tab]||renderToday)()}</main>${renderNav()}`}
  if(ui.sheet&&S.onboarded&&SHEETS[ui.sheet.type])h+=SHEETS[ui.sheet.type](ui.sheet);
  const ov=ui.sheet&&ui.sheet.type==='dlg'?null:currentOverlay();if(ov&&S.onboarded)h+=renderOverlay(ov);
  root.innerHTML=h;
  document.body.style.overflow=(ui.sheet||ov)?'hidden':'';
  afterRender();
}
const AFTER=[];function afterRender(){AFTER.forEach(f=>f())}

/* ---------- events ---------- */
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=ACTIONS[b.dataset.a];if(f)f(b.dataset,b,e);
});
root.addEventListener('submit',e=>{const f=FORMS[e.target.id];if(f){e.preventDefault();f(e)}});
let hiddenAt=0,lastDay=todayKey();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(S.lock&&hiddenAt&&Date.now()-hiddenAt>5*60*1000){ui.unlocked=false;ui.sheet=null}
  if(S.onboarded)render();
});
setInterval(()=>{const t=todayKey();if(t!==lastDay){lastDay=t;if(S.onboarded&&!document.querySelector('input:focus,textarea:focus'))render()}},30000);

 ['disc',1,'Nie zweimal','Einmal verpassen ist ein Ausrutscher. Zweimal ist der Anfang einer neuen Gewohnheit.'],

 ['disc',1,'Schlechtes Wetter','Auch an schlechten Tagen zählt der Tag. Gerade an schlechten Tagen.'],

 ['wis',0,'Weglassen','Manchmal ist der größte Fortschritt, etwas wegzulassen.'],

 ['wis',0,'Bambus','Bambus wächst jahrelang unsichtbar in die Tiefe. Dann in Wochen meterhoch.'],
