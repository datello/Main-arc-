  for(const q of ord){const rem=q.type==='count'?(q.unit==='min'?Math.max(0,qTarget(q,c.d)-qVal(q,c.d)):q.unit==='Wdh'?5:q.unit==='Schritte'?Math.ceil((qTarget(q,c.d)-qVal(q,c.d))/100):10):q.lib==='workout'?30:5;

  if(ui.chatSug&&ui.chatSug.length)return ui.chatSug;
  const c=cctx();const base=[];
  if(!c.cleared&&c.open.length)base.push('Was steht heute an?','Ich hab keine Lust.','Ich hab nur 15 Minuten.');
  else base.push('Wie steh ich?','Gib mir einen Tipp.');
  base.push('Erzähl mir einen Witz.','Wer bist du eigentlich?');
  return base.slice(0,4);
}
function dayLabel(d){const t=todayKey();return d===t?'Heute':d===shiftDay(t,-1)?'Gestern':fmtDate(d)}
function chatLogHTML(){
  const now=Date.now();let prevW=null,prevD=null;let h='';
  for(const m of S.chat){
    if(m.d!==prevD){h+=`<div class="cday"><span>${dayLabel(m.d)}</span></div>`;prevD=m.d;prevW=null}
    const nw=m.at&&now-m.at<500?' new':'';
    if(m.w==='u'){h+=`<div class="msg u${nw}"><div class="bub">${esc(m.t)}</div></div>`;prevW='u';continue}
    const show=prevW!=='j';prevW='j';
    h+=`<div class="msg${nw}" style="--c:${JIRAIYA.c}">${show?avatar(JIRAIYA,m.m):'<span class="av ghost"></span>'}<div class="mcol"><div class="bub">${esc(m.t)}</div>${m.a&&m.a.length?`<div class="bacts">${m.a.map(a=>`<button class="rchip sm" data-a="chat-act" data-x="${a.x}" data-v="${esc(a.v||'')}">${esc(a.l)}</button>`).join('')}</div>`:''}</div></div>`;
  }
  if(ui.chatTyping)h+=`<div class="msg" style="--c:${JIRAIYA.c}">${avatar(JIRAIYA)}<div class="bub typing" aria-label="Jiraiya schreibt"><i></i><i></i><i></i></div></div>`;
  return h;
}
function chipsHTML(){return chatSuggestions().map(t=>`<button class="rchip sm" data-a="chat-say" data-v="${esc(t)}">${esc(t)}</button>`).join('')}
function lastMood(){for(let i=S.chat.length-1;i>=0;i--)if(S.chat[i].w==='j')return S.chat[i].m;return 'grin'}
function renderChat(){
  ensureDaily();
  return `<section class="sbanner" aria-label="Jiraiya, dein Sensei"><div class="sb-in"><b>Jiraiya</b><small><span class="odot"></span>${ui.chatTyping?'schreibt …':'online'} · Main Sensei</small></div></section>
    <div id="chatlog" class="clog" aria-live="polite">${chatLogHTML()}</div>
    <div class="cspace"></div>
    <div class="cbar"><div id="chatchips" class="cchips">${chipsHTML()}</div>
      <form id="chatform" class="cform" autocomplete="off"><input id="chat-in" placeholder="Schreib Jiraiya …" aria-label="Nachricht an Jiraiya" maxlength="400" enterkeyhint="send"><button class="btn btn-ice" type="submit" aria-label="Senden">➤</button></form></div>`;
}
function paintChat(){
  if(ui.tab!=='sensei'||ui.sheet)return;const log=document.getElementById('chatlog');if(!log){render();return}
  log.innerHTML=chatLogHTML();const ch=document.getElementById('chatchips');if(ch)ch.innerHTML=chipsHTML();
  const sm=document.querySelector('.sbanner small');if(sm)sm.innerHTML=`<span class="odot"></span>${ui.chatTyping?'schreibt …':'online'} · Main Sensei`;
  window.scrollTo(0,document.documentElement.scrollHeight);
}
AFTER.push(()=>{if(ui.tab==='sensei'&&!ui.sheet&&!currentOverlay())window.scrollTo(0,document.documentElement.scrollHeight)});

/* ---------- Sensei-Karte auf HEUTE ---------- */
function cardLine(c){if(c.missedY&&!c.cleared&&!c.rest)return{m:'serious',t:'Gestern ist dir entglitten. Heute zählt – nicht zweimal hintereinander.'};const m=missionMsg(c);return{m:m[0],t:m[1]}}
function renderSenseiCard(){
  ensureDaily();const last=cardLine(cctx());
  return `<section class="win scard"><div class="msg" style="--c:${JIRAIYA.c};max-width:100%">${avatar(JIRAIYA,last.m)}<div class="mcol"><span class="who">Jiraiya</span><div class="bub">${esc(last.t)}</div></div></div>
    <div class="row wrap" style="gap:8px;margin-top:10px"><button class="rchip sm" data-a="chat-open">Antworten</button>${!dayLog(todayKey()).bonus?`<button class="rchip sm" data-a="chat-open" data-v="Ich hab keine Lust.">Ich hab keine Lust.</button>`:''}</div></section>`;
}
ACTIONS['chat-open']=ds=>{ui.tab='sensei';ui.sheet=null;render();if(ds&&ds.v)chatSend(ds.v);setTimeout(()=>{const i=document.getElementById('chat-in');if(i&&!(ds&&ds.v))try{i.focus({preventScroll:true})}catch(e){}},60)};
/* iPhone-Tastatur: Eingabeleiste über der Tastatur halten */
function vvFix(){try{const bar=document.querySelector('.cbar');const vv=window.visualViewport;if(!vv)return;const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  document.body.classList.toggle('kbd',kb>80);if(bar)bar.style.bottom=kb>80?kb+'px':''}catch(e){}}
try{if(window.visualViewport){window.visualViewport.addEventListener('resize',vvFix);window.visualViewport.addEventListener('scroll',vvFix)}}catch(e){}
AFTER.push(vvFix);

/* Chat öffnet immer bei der neuesten Nachricht */
const _tabAct=ACTIONS.tab;
ACTIONS.tab=ds=>{_tabAct(ds);if(ds.t==='sensei')requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight))};

cloudInit();
