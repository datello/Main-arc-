/* ==== 25_arcs_data.js ==== */

/* ============================================================
   ARCS: Lernpfade, die je eine Kompetenz beibringen
   Kapitel: [Titel, Wissen, Situation{q,o,a,hint,why}, Praxis]
   Prüfung: [Frage, Optionen, richtig, Erklärung]
   Allgemeines Wissen – keine medizinische Beratung.
   ============================================================ */
const ARCS=[];
const ARC=(id,o)=>ARCS.push(Object.assign({id},o));
const CH=(t,learn,q,o,a,hint,why,task)=>({t,learn,sit:{q,o,a,hint,why},task});

ARC('erwachen',{n:'Arc I · Erwachen',comp:'Gewohnheiten bauen',title:'Gewohnheitsarchitekt',stat:'WIL',
  d:'Wie aus Vorsätzen Automatismen werden: Auslöser, Wenn-dann-Pläne, Umgebung, kleine Schritte und der richtige Umgang mit Rückfällen.',
  ch:[
  CH('Die Gewohnheitsschleife','Eine Gewohnheit ist ein Verhalten, das durch einen Auslöser fast von selbst startet: Auslöser → Handlung → Belohnung. Je öfter du dasselbe im selben Kontext tust, desto weniger Entscheidung braucht es. In einer bekannten Studie dauerte es im Mittel etwa 66 Tage, bis ein Verhalten automatisch lief – mit großer Spanne von wenigen Wochen bis über acht Monate.',
    'Du willst jeden Tag lesen und nimmst es dir „irgendwann abends“ vor. Seit einer Woche vergisst du es ständig. Was fehlt am ehesten?',['Mehr Motivation','Ein fester Auslöser – ein klarer Moment, nach dem du liest','Ein spannenderes Buch'],1,
    'Woran soll sich dein Gehirn erinnern, wenn „irgendwann“ kein Moment ist, den es erkennen kann?','Gewohnheiten hängen an Auslösern. „Nach dem Zähneputzen lese ich zwei Seiten“ gibt dem Verhalten einen festen Platz im Tag.',
    'Wähle eine deiner Daily Quests und schreib auf, nach welchem festen Moment im Tag du sie ab jetzt machst.'),
  CH('Wenn-dann-Pläne','Ein Wenn-dann-Plan legt vorher fest, was du in einer bestimmten Situation tust: „Wenn ich nach Hause komme, ziehe ich sofort die Laufschuhe an.“ Solche Pläne erhöhen in vielen Studien die Umsetzung deutlich, weil die Entscheidung schon getroffen ist, bevor der Moment kommt.',
    'Welcher Vorsatz hat die besten Chancen, umgesetzt zu werden?',['„Ich will mehr Sport machen.“','„Montag, Mittwoch, Freitag nach der Arbeit ziehe ich direkt die Laufschuhe an und laufe 20 Minuten.“','„Ich gehe diese Woche dreimal joggen.“'],1,
    'Welcher Satz sagt dir genau wann, wo und was – so dass du im Moment nichts mehr entscheiden musst?','Je konkreter Situation und Handlung, desto weniger Raum bleibt für Ausreden. Vage Vorsätze verlieren gegen den Alltag.',
    'Schreib für morgen zwei Wenn-dann-Pläne für deine Quests auf.'),
  CH('Umgebung schlägt Willenskraft','Menschen, die als besonders diszipliniert gelten, widerstehen Versuchungen oft gar nicht häufiger – sie geraten seltener in Versuchung. Mach das Richtige leicht und das Falsche umständlich: Sportsachen bereitlegen, Süßes nicht im Haus haben, das Handy aus dem Schlafzimmer.',
    'Abends greifst du immer zum Handy statt zum Buch. Was hilft am meisten?',['Sich jeden Abend fest vornehmen, stark zu bleiben','Eine App mit Motivationssprüchen installieren','Das Handy im Flur laden und das Buch aufs Kissen legen'],2,
    'Was passiert, wenn das Richtige näher liegt als das Falsche – wie viel Willenskraft brauchst du dann noch?','Wer die Umgebung umbaut, muss weniger kämpfen. Willenskraft ist begrenzt, gute Gestaltung wirkt jeden Tag.',
    'Verändere heute eine Sache in deiner Umgebung, die eine deiner Quests leichter macht.'),
  CH('Klein anfangen','Eine Gewohnheit entsteht durch Wiederholung, nicht durch Intensität. Starte so klein, dass du auch an schlechten Tagen nicht scheiterst – zwei Minuten Meditation, fünf Liegestütz. Steigern kannst du später; erst muss das Verhalten zum festen Teil deines Tages werden.',
    'Du willst mit Meditation anfangen. Was ist der klügste Start?',['Täglich zwei Minuten, auch an schlechten Tagen','Täglich 30 Minuten ab morgen','Einmal pro Woche eine Stunde'],0,
    'Welche Version schaffst du auch an deinem schlechtesten Tag – und welche baut dadurch die Gewohnheit auf?','Kleine, tägliche Wiederholungen festigen den Ablauf. Große Starts scheitern oft in der ersten anstrengenden Woche.',
    'Schreib für jede deiner Daily Quests eine Minimal-Version für schlechte Tage auf.'),
  CH('Nie zweimal','Einzelne verpasste Tage haben in der Forschung zur Gewohnheitsbildung kaum geschadet. Gefährlich ist das Alles-oder-nichts-Denken: „Jetzt ist es eh egal.“ Plane die Rückkehr vorher – und sprich mit dir wie mit einem Freund. Selbstkritik lähmt eher, als dass sie antreibt.',
    'Du hast gestern alle Quests verpasst. Was ist heute am sinnvollsten?',['Heute doppelt so viel machen, um es auszugleichen','Die Woche abschreiben und Montag neu starten','Heute ganz normal weitermachen – notfalls mit der Minimal-Version'],2,
    'Was schützt die Gewohnheit mehr: eine Heldentat heute oder dass auf einen verpassten Tag kein zweiter folgt?','Ein Ausrutscher ist kein Muster. Zwei verpasste Tage in Folge sind der Anfang eines neuen Musters – deshalb zählt der Tag danach am meisten.',
    'Schreib deinen Rückkehr-Plan auf: „Wenn ich einen Tag verpasse, dann mache ich am nächsten Tag …“')],
  exam:[
    ['Was bedeuten die 66 Tage in der Gewohnheitsforschung?',['Nach genau 66 Tagen ist jede Gewohnheit automatisch','Der Mittelwert einer Studie – die Spanne war sehr groß','Die Zeit, die man ohne Fehltag schaffen muss'],1,'Im Mittel etwa 66 Tage, einzelne Personen brauchten deutlich weniger oder mehr.'],
    ['Welche Strategie nutzt Umgebungsgestaltung?',['Sich Ziele aufschreiben','Sich nach dem Sport belohnen','Süßigkeiten gar nicht erst einkaufen'],2,'Wer die Versuchung entfernt, muss ihr nicht widerstehen.'],
    ['Was ist ein Wenn-dann-Plan?',['„Wenn ich nach Hause komme, stelle ich sofort die Wasserflasche auf den Tisch.“','„Ich will gesünder leben.“','„Ab nächstem Jahr wird alles anders.“'],0,'Konkrete Situation plus konkrete Handlung.'],
    ['Du hast drei Tage verpasst. Welcher Gedanke hilft am meisten?',['„Ich bin halt undiszipliniert.“','„Heute zählt – die Minimal-Version reicht.“','„Ich starte nächsten Monat neu.“'],1,'Rückkehr schlägt Neustart. Der wichtigste Tag ist immer der nächste.']]});

ARC('nacht',{n:'Arc II · Nacht',comp:'Schlaf & Erholung',title:'Schlafhüter',stat:'VIT',
  d:'Warum Schlaf die Grundlage von allem ist – und wie du ihn mit Licht, Rhythmus, Koffein-Regeln und einem guten Schlafzimmer verbesserst.',
  ch:[
  CH('Warum Schlaf zählt','Für die meisten Erwachsenen werden 7 bis 9 Stunden Schlaf empfohlen. Im Schlaf festigt das Gehirn Gelerntes, Muskeln erholen sich, Hunger- und Stresshormone werden reguliert. Wer zu wenig schläft, hat oft mehr Appetit auf Süßes, kann sich schlechter konzentrieren und trainiert schwächer.',
    'Diese Woche ist voll. Wo „sparst“ du Zeit am schlechtesten?',['Beim Scrollen am Abend','Bei einer Serie','Beim Schlaf – 5 statt 7,5 Stunden'],2,
    'Welche dieser Zeiten macht dich am nächsten Tag langsamer, hungriger und vergesslicher?','Schlaf ist keine verlorene Zeit, sondern die Phase, in der dein Körper die Arbeit des Tages verarbeitet.',
    'Rechne aus, wann du ins Bett musst, um 7,5 Stunden vor deinem Wecker zu schlafen. Stell dir eine Erinnerung 30 Minuten vorher.'),
  CH('Die innere Uhr','Dein Körper hat einen etwa 24-stündigen Rhythmus. Der stärkste Taktgeber ist Licht – vor allem morgens. Eine feste Aufstehzeit, auch am Wochenende, stabilisiert den Rhythmus am meisten. Wer samstags drei Stunden später aufsteht, erzeugt eine Art „sozialen Jetlag“.',
    'Was stabilisiert deinen Rhythmus am stärksten?',['Jeden Tag ähnliche Aufstehzeit plus Tageslicht am Morgen','Am Wochenende lange ausschlafen, um Schlaf nachzuholen','Abends lange wach bleiben, bis man richtig müde ist'],0,
    'Woran orientiert sich deine innere Uhr jeden Morgen – und was passiert, wenn sie samstags drei Stunden später ein Signal bekommt?','Licht am Morgen und eine konstante Aufstehzeit stellen die Uhr jeden Tag neu. Ausschlafen verschiebt sie.',
    'Geh morgen innerhalb der ersten Stunde nach dem Aufstehen zehn Minuten nach draußen.'),
  CH('Koffein und Alkohol','Koffein hat eine Halbwertszeit von grob fünf Stunden, je nach Mensch deutlich mehr oder weniger. Ein Kaffee am Nachmittag kann den Tiefschlaf beeinträchtigen, auch wenn du gut einschläfst. Alkohol macht schläfrig, stört aber die zweite Nachthälfte – der Schlaf wird unruhiger und weniger erholsam.',
    'Du trinkst um 16 Uhr einen großen Kaffee und schläfst um 23 Uhr problemlos ein. Was folgt daraus?',['Koffein wirkt bei mir nicht','Einschlafen klappt – die Schlafqualität kann trotzdem leiden','Ich kann abends ruhig noch einen trinken'],1,
    'Wie viel Koffein ist nach sieben Stunden noch im Körper, wenn etwa alle fünf Stunden die Hälfte abgebaut wird?','Gut einschlafen heißt nicht gut schlafen. Koffein kann die Tiefschlafphasen verkürzen, ohne dass du es merkst.',
    'Leg dir heute eine Koffein-Grenze fest (zum Beispiel 14 Uhr) und halte sie ein.'),
  CH('Das Schlafzimmer','Gute Bedingungen: kühl (etwa 16 bis 19 °C), dunkel, ruhig. Das Bett ist zum Schlafen da, nicht zum Arbeiten oder Scrollen. Eine ruhige Abendroutine von 30 bis 60 Minuten ohne Bildschirm signalisiert dem Körper: Der Tag ist vorbei.',
    'Du liegst seit 40 Minuten wach und grübelst. Was hilft am ehesten?',['Liegen bleiben und es erzwingen','Das Handy nehmen, bis man müde wird','Aufstehen, bei gedimmtem Licht etwas Ruhiges tun, zurück ins Bett, wenn du müde bist'],2,
    'Was lernt dein Gehirn über das Bett, wenn du dort jede Nacht lange wach liegst und kämpfst?','Das Bett soll mit Schlaf verknüpft sein, nicht mit Grübeln. Kurz aufstehen und ruhig zurückkehren hilft vielen.',
    'Bau dir eine 20-minütige Abendroutine ohne Bildschirm und probier sie heute Abend aus.'),
  CH('Erholung ist Training','Fortschritt entsteht in der Erholung nach der Belastung. Warnzeichen für zu viel: schlechter Schlaf, sinkende Leistung, Gereiztheit, ständige Müdigkeit. Ein kurzes Nickerchen von 10 bis 20 Minuten kann helfen. Halten Schlafprobleme über Wochen an, lass das ärztlich abklären.',
    'Seit zwei Wochen schläfst du schlecht, die Trainingsleistung sinkt und du bist gereizt. Was zuerst?',['Mehr trainieren, um müder zu werden','Belastung reduzieren, Schlafroutine prüfen – und wenn es anhält, ärztlich abklären lassen','Energy-Drinks gegen die Müdigkeit'],1,
    'Was passiert im Körper, wenn die Belastung dauerhaft größer ist als die Erholung?','Mehr Belastung verschärft ein Erholungsproblem. Erst Erholung herstellen, dann wieder steigern.',
    'Plane für diese Woche einen echten Ruhetag ohne hartes Training und trag ihn in deinen Kalender ein.')],
  exam:[
    ['Wie viel Schlaf wird den meisten Erwachsenen empfohlen?',['5–6 Stunden','7–9 Stunden','10–12 Stunden'],1,'Die meisten Empfehlungen nennen 7–9 Stunden.'],
    ['Was stabilisiert den Schlafrhythmus am stärksten?',['Feste Aufstehzeit mit Licht am Morgen','Langer Mittagsschlaf','Am Wochenende ausschlafen'],0,'Aufstehzeit und Morgenlicht sind die stärksten Taktgeber.'],
    ['Was macht Alkohol mit dem Schlaf?',['Er verbessert ihn insgesamt','Er hat keinen Einfluss','Er macht schläfrig, verschlechtert aber die zweite Nachthälfte'],2,'Einschlafen geht schneller, erholsam wird der Schlaf nicht.'],
    ['Welches Schlafzimmer ist ideal?',['Kühl, dunkel, ruhig','Warm und hell','Mit Fernseher als Einschlafhilfe'],0,'Kühle, Dunkelheit und Ruhe fördern den Schlaf.']]});

ARC('eisen',{n:'Arc III · Eisen',comp:'Krafttraining',title:'Kraftschmied',stat:'STR',
  d:'Die Grundlagen von sicherem, wirksamem Krafttraining: Grundbewegungen, Technik, Anstrengung richtig dosieren, steigern und erholen.',
  ch:[
  CH('Die Grundbewegungen','Fast jedes gute Programm deckt fünf Muster ab: Kniebeuge (Beine), Hüftbeuge wie Kreuzheben (Rückseite), Drücken (Brust, Schultern), Ziehen (Rücken) und Rumpf. Für Einsteiger reicht oft ein Ganzkörperplan zwei- bis dreimal pro Woche.',
    'Dein Plan: Montag Bizeps, Mittwoch Bauch, Freitag Bizeps. Was fehlt am meisten?',['Mehr Bizeps','Mehr Bauchübungen','Die großen Muster: Beine, Hüfte, Drücken, Ziehen'],2,
    'Welche großen Muskelgruppen hat dieser Plan überhaupt nicht trainiert?','Kleine Muskeln sind okay als Ergänzung. Die Basis sind die großen Bewegungsmuster – sie bringen am meisten Kraft und Alltagsnutzen.',
    'Schreib einen Ganzkörperplan mit je einer Übung pro Grundbewegung.'),
  CH('Technik vor Gewicht','Saubere Technik heißt: kontrollierte Bewegung, voller Bewegungsumfang, der dir schmerzfrei möglich ist, langsames Absenken. Ein Video von der Seite zeigt mehr als jedes Gefühl. Wenn die Technik bricht, ist das Gewicht zu schwer – nicht du zu schwach.',
    'Beim letzten Satz Kniebeugen fallen deine Knie nach innen. Was tust du?',['Gewicht reduzieren, „Knie nach außen“ denken, filmen','Mehr Gewicht, damit die Muskeln es lernen','Ignorieren, passiert jedem'],0,
    'Welches Bewegungsmuster trainierst du gerade, wenn du so weitermachst?','Was du unter Last wiederholst, schleifst du ein. Lieber leichter und sauber.',
    'Filme einen Satz einer Übung von der Seite und prüfe deine Technik.'),
  CH('Anstrengung: RIR','RIR heißt „Reps in Reserve“: wie viele saubere Wiederholungen noch drin gewesen wären. Für Fortschritt reicht es meist, Sätze mit RIR 1 bis 3 zu beenden. Bis zum kompletten Versagen musst du selten gehen – es kostet viel Erholung.',
    'Du machst 3×10 und hättest jedes Mal noch acht Wiederholungen geschafft. Was bedeutet das?',['Perfekt – sicher ist sicher','Der Reiz ist wahrscheinlich zu gering; Gewicht erhöhen, bis etwa RIR 1–3','Ab jetzt immer bis zum Versagen'],1,
    'Wenn noch acht Wiederholungen im Tank waren – wie nah warst du an einer echten Herausforderung?','Muskeln wachsen, wenn Sätze anstrengend genug sind. RIR 1–3 ist der Bereich, der wirkt, ohne dich zu zerstören.',
    'Schätz beim nächsten Training nach jedem Satz deinen RIR und notiere ihn im Training-Log.'),
  CH('Steigern','Progressive Überlastung heißt: Der Reiz wächst langsam. Einfach umzusetzen ist die doppelte Progression – erst Wiederholungen steigern (zum Beispiel von 8 auf 12), dann Gewicht erhöhen und wieder bei 8 beginnen. Steigere nur, wenn die letzte Einheit sauber war und du erholt bist.',
    'Letzte Woche: 3×8 mit 40 kg, sauber, RIR 2. Was machst du diese Woche?',['Immer gleich bleiben','3×9 oder 42,5 kg – ein kleiner Schritt nach vorn','50 kg'],1,
    'Welcher Schritt ist groß genug für einen neuen Reiz, aber klein genug für saubere Technik?','Kleine Schritte summieren sich. Große Sprünge kosten Technik und erhöhen das Risiko.',
    'Leg für deine Hauptübung die nächste Steigerung fest: mehr Wiederholungen oder +2,5 kg.'),
  CH('Schmerz und Erholung','Muskelkater ist ein dumpfer Schmerz, der nach ein bis drei Tagen vergeht. Stechender, punktueller Schmerz während einer Übung ist ein Stoppsignal. Plane Ruhetage ein, schlaf genug und iss ausreichend Protein. Anhaltende Schmerzen gehören zu Ärztin oder Physiotherapeut.',
    'Beim Drücken spürst du einen stechenden Schmerz in der Schulter. Was tust du?',['Durchziehen, das gehört dazu','Schmerzmittel nehmen und weitermachen','Abbrechen, schmerzfreie Alternative wählen und bei Anhalten abklären lassen'],2,
    'Was ist der Unterschied zwischen „es brennt, weil es anstrengend ist“ und „es sticht“?','Anstrengung ist erwünscht, stechender Schmerz nicht. Weitertrainieren kann eine kleine Reizung zu einer langen Pause machen.',
    'Plane deine Woche: An welchen Tagen trainierst du Kraft, an welchen erholst du dich?')],
  exam:[
    ['Welche Übung gehört zum Muster „Ziehen“?',['Kniebeuge','Rudern','Liegestütz'],1,'Rudern und Klimmzüge sind Zugbewegungen.'],
    ['Was bedeutet RIR 2?',['Zwei Sätze','Zwei Minuten Pause','Zwei saubere Wiederholungen wären noch möglich gewesen'],2,'Reps in Reserve.'],
    ['Wann steigerst du das Gewicht?',['Wenn alle Sätze sauber waren und du erholt bist','Jede Woche um 10 kg','Wenn andere mehr heben'],0,'Steigerung folgt Leistung und Erholung.'],
    ['Stechender Schmerz bei einer Übung bedeutet …',['… dass es wirkt','… ein Stoppsignal: abbrechen, anpassen, bei Anhalten abklären','… mehr Gewicht'],1,'Schmerz ist eine Information, kein Trainingsziel.']]});

ARC('atem',{n:'Arc IV · Atem',comp:'Ausdauer & Herz',title:'Langstreckler',stat:'END',
  d:'Wie Ausdauer wirklich wächst: lockere Zonen, langsamer Aufbau, gezielte Intervalle, Alltagsbewegung und Warnsignale.',
  ch:[
  CH('Locker ist das Geheimnis','Viele Ausdauersportler trainieren den Großteil ihrer Zeit locker – in einem Tempo, bei dem man noch ganze Sätze sprechen kann (Talk-Test). Lockeres Training baut die Grundlage auf: ein stärkeres Herz, mehr Mitochondrien, bessere Fettverbrennung – ohne dich zu erschöpfen.',
    'Du läufst jedes Mal so schnell du kannst und bist danach völlig platt. Was bringt am meisten?',['Die meisten Läufe so locker, dass du noch reden kannst','Noch schneller laufen','Ganz aufhören mit Laufen'],0,
    'Wie oft pro Woche kannst du hart laufen, ohne einzubrechen – und wie oft locker?','Viel lockeres Volumen plus wenig hartes ist nachhaltiger als jeden Tag am Limit.',
    'Mach heute 20–30 Minuten Ausdauer im Talk-Test-Tempo.'),
  CH('Langsam aufbauen','Herz und Lunge passen sich schneller an als Sehnen, Bänder und Knochen. Wer den Umfang zu schnell steigert, riskiert Überlastung. Als grobe Orientierung gilt: pro Woche nur wenig mehr, alle paar Wochen eine leichtere Woche. Gehpausen sind am Anfang völlig in Ordnung.',
    'Du läufst seit zwei Wochen regelmäßig und fühlst dich super. Nächste Woche willst du einen Halbmarathon laufen. Was rätst du dir?',['Machen – das Herz ist ja fit','Ein realistischeres Ziel mit langsamem Aufbau über Wochen','Vorher jeden Tag 20 km laufen'],1,
    'Welches Gewebe passt sich langsamer an als dein Herz – und was passiert, wenn du es überholst?','Das Gefühl täuscht: Die Kondition ist schneller da als die Belastbarkeit des Bewegungsapparats.',
    'Schreib einen 4-Wochen-Plan, in dem dein längster Lauf oder Spaziergang jede Woche nur ein wenig länger wird.'),
  CH('Intervalle','Intervalle sind kurze, harte Abschnitte mit Pausen dazwischen, zum Beispiel 6×1 Minute zügig, 2 Minuten locker. Sie verbessern die Leistungsfähigkeit in wenig Zeit. Ein bis zwei Einheiten pro Woche reichen – immer mit Aufwärmen.',
    'Du hast diese Woche nur 25 Minuten Zeit für Ausdauer. Was ist am wirksamsten?',['25 Minuten gemütlich gehen','10 Minuten aufwärmen, dann 6×1 Minute zügig mit Pausen','Gar nichts, lohnt sich nicht'],1,
    'Was kannst du in kurzer Zeit tun, das dein Herz-Kreislauf-System stärker fordert?','Intervalle liefern in wenig Zeit einen starken Reiz – als Ergänzung zum lockeren Training.',
    'Mach heute oder morgen eine kurze Intervalleinheit: aufwärmen, dann 5×1 Minute zügig, 2 Minuten locker.'),
  CH('Alltagsbewegung','Die WHO empfiehlt Erwachsenen 150 bis 300 Minuten moderate Bewegung pro Woche (oder 75 bis 150 Minuten intensive) plus Krafttraining an zwei Tagen. Auch Alltagsbewegung zählt: Schritte, Treppen, Rad statt Bus. Langes Sitzen regelmäßig unterbrechen.',
    'Wie kommst du am leichtesten auf 150 Minuten pro Woche?',['Ein einziger 2,5-Stunden-Lauf am Sonntag','Fünfmal 30 Minuten zügig gehen oder Rad fahren','Gar nicht, das ist zu viel'],1,
    'Was ist leichter in einen normalen Alltag einzubauen – und auch an stressigen Tagen durchzuhalten?','Verteilte Bewegung ist alltagstauglicher und schonender als ein einziger großer Block.',
    'Bau heute 15 Minuten zusätzliche Alltagsbewegung ein: Treppe, eine Station früher aussteigen, Telefonat im Gehen.'),
  CH('Warnsignale','Anstrengung ist normal. Brustschmerz, starke Atemnot, Schwindel, Herzrasen oder Ohnmachtsgefühl sind es nicht: sofort aufhören und bei einem möglichen Notfall den Notruf 112 wählen. Bei Vorerkrankungen oder nach langer Pause vorher ärztlich klären, was für dich passt.',
    'Beim Laufen bekommst du plötzlich Druck auf der Brust und wirst schwindlig. Was tust du?',['Langsamer weiterlaufen','Sofort aufhören, hinsetzen, Hilfe holen – bei anhaltenden Beschwerden Notruf 112','Erst mal nach Hause laufen'],1,
    'Sind das Zeichen von Anstrengung – oder von etwas, das ein Arzt beurteilen muss?','Brustschmerz mit Schwindel kann ein Notfall sein. Lieber einmal zu viel Hilfe holen als einmal zu wenig.',
    'Speichere die wichtigsten Notfallnummern in deinem Handy und finde heraus, wo der nächste Defibrillator in deinem Studio oder in deiner Nähe hängt.')],
  exam:[
    ['Was ist der Talk-Test?',['Wer noch in ganzen Sätzen sprechen kann, läuft locker','Ein Lungentest beim Arzt','Laut zählen beim Laufen'],0,'Eine einfache Methode für lockere Intensität.'],
    ['Warum Umfang langsam steigern?',['Weil Sehnen und Knochen sich langsamer anpassen als das Herz','Weil Laufen schädlich ist','Weil es egal ist'],0,'Der Bewegungsapparat braucht mehr Zeit.'],
    ['Wie viel moderate Bewegung empfiehlt die WHO pro Woche?',['30 Minuten','150–300 Minuten','10 Stunden'],1,'Plus Krafttraining an zwei Tagen.'],
    ['Brustschmerz und Schwindel beim Sport bedeuten …',['… langsamer machen','… sofort aufhören und Hilfe holen','… mehr trinken'],1,'Mögliche Notfallzeichen – Notruf 112.']]});

ARC('treibstoff',{n:'Arc V · Treibstoff',comp:'Ernährung',title:'Versorger',stat:'VIT',
  d:'Die Grundlagen guter Ernährung ohne Diät-Wahn: Energiebilanz, Protein, Tellermodell, Trinken und ein entspannter Umgang mit Essen.',
  ch:[
  CH('Energie und Nährstoffe','Kohlenhydrate und Protein liefern etwa 4 kcal pro Gramm, Fett etwa 9 kcal. Ob du Gewicht verlierst, hältst oder zunimmst, hängt langfristig vor allem von der Energiebilanz ab. Welche Lebensmittel du wählst, entscheidet über Sättigung, Energie und Gesundheit.',
    'Was bestimmt langfristig vor allem, ob dein Körpergewicht steigt oder sinkt?',['Die Uhrzeit der letzten Mahlzeit','Die Energiebilanz über Wochen','Ob du Kohlenhydrate isst'],1,
    'Was passiert, wenn du über Wochen mehr Energie aufnimmst, als du verbrauchst – unabhängig von der Uhrzeit?','Die Bilanz über die Zeit zählt. Einzelne Regeln wie „nach 18 Uhr nichts“ wirken höchstens, weil man dadurch insgesamt weniger isst.',
    'Schau dir heute bei drei Lebensmitteln die Nährwerttabelle an: Wie viel Protein, Fett und Kohlenhydrate stecken darin?'),
  CH('Protein','Protein liefert die Bausteine für Muskeln. Wer Kraft trainiert, profitiert meist von etwa 1,6 g pro Kilogramm Körpergewicht am Tag, verteilt auf mehrere Mahlzeiten. Einfache Regel: Baue jede Mahlzeit um eine Proteinquelle – Quark, Eier, Hülsenfrüchte, Fisch, Fleisch, Tofu. Bei Erkrankungen gehört die Frage in ärztliche Hände.',
    'Du wiegst 75 kg, trainierst Kraft und isst etwa 50 g Protein am Tag. Was fällt auf?',['Das passt genau','Das liegt deutlich unter dem Richtwert von etwa 120 g','Protein ist für Kraft unwichtig'],1,
    'Was ergibt 75 × 1,6 – und wie weit liegt 50 davon entfernt?','75 kg × 1,6 = 120 g. Bei 50 g fehlt ein großer Teil der Bausteine für den Muskelaufbau.',
    'Plane deine Mahlzeiten für morgen so, dass jede eine Proteinquelle enthält, und trag sie im Ernährungs-Tool ein.'),
  CH('Das Tellermodell','Ein einfacher Kompass: die Hälfte des Tellers Gemüse oder Salat, ein Viertel Protein, ein Viertel Kohlenhydrate wie Reis, Kartoffeln oder Vollkorn. Ballaststoffe aus Gemüse, Obst und Vollkorn machen satt und sind gut für die Verdauung.',
    'Welcher Teller passt am besten zum Tellermodell?',['Große Portion Nudeln mit Sahnesoße','Halber Teller Gemüse, Hähnchen oder Linsen, eine Portion Reis','Ein Salatblatt und ein Glas Wasser'],1,
    'Welcher Teller hat Gemüse, Protein und Kohlenhydrate in einem sinnvollen Verhältnis – und macht trotzdem satt?','Das Tellermodell ist kein Verzicht, sondern eine Verteilung. Zu wenig essen ist genauso unpassend wie zu viel.',
    'Stell heute eine Mahlzeit nach dem Tellermodell zusammen und mach ein Foto davon.'),
  CH('Trinken','Schon leichter Flüssigkeitsmangel kann Konzentration und Leistung senken. Wasser und ungesüßter Tee sind die beste Basis. Ein einfacher Hinweis: Heller Urin spricht meist für ausreichend Flüssigkeit. Bei Hitze und Sport steigt der Bedarf.',
    'Du hast nachmittags oft Kopfschmerzen und kannst dich schlecht konzentrieren. Du trinkst kaum etwas. Erster sinnvoller Versuch?',['Mehr Kaffee','Eine Woche lang bewusst regelmäßig Wasser trinken und beobachten','Energy-Drinks'],1,
    'Was ist die einfachste Ursache, die du selbst ausschließen kannst?','Erst das Einfache prüfen. Halten Kopfschmerzen trotzdem an, lass sie ärztlich abklären.',
    'Stell dir heute eine volle Wasserflasche sichtbar hin und trag deine Gläser im Ernährungs-Tool ein.'),
  CH('Ohne Diät-Wahn','Crash-Diäten führen oft zu Heißhunger, Muskelverlust und dem Jo-Jo-Effekt. Die Waage schwankt täglich um ein bis zwei Kilo durch Wasser – einzelne Messungen sagen wenig. Nachhaltig ist, was du ein Jahr lang machen kannst. Wenn Essen, Gewicht oder Figur dich stark belasten, sprich mit einer Fachperson.',
    'Die Waage zeigt heute ein Kilo mehr als gestern. Was ist am wahrscheinlichsten?',['Du hast über Nacht ein Kilo Fett zugenommen','Normale Wasserschwankung – nur der Trend über Wochen zählt','Die Diät funktioniert nicht'],1,
    'Wie viele Kalorien wären nötig, um über Nacht ein Kilo Fett aufzubauen?','Ein Kilo Körperfett entspricht grob 7.000 kcal. Tägliche Schwankungen sind fast immer Wasser.',
    'Schreib drei Ernährungsgewohnheiten auf, die du dir auch in einem Jahr noch vorstellen kannst.')],
  exam:[
    ['Wie viele kcal liefert ein Gramm Fett?',['4','9','2'],1,'Fett ist der energiedichteste Nährstoff.'],
    ['Richtwert Protein für Kraftsportler?',['Etwa 1,6 g pro kg Körpergewicht','5 g pro kg','Protein ist egal'],0,'Ein praxisnaher Richtwert für Gesunde.'],
    ['Wie sieht ein Teller nach dem Tellermodell aus?',['Halb Gemüse, ein Viertel Protein, ein Viertel Kohlenhydrate','Nur Protein','Nur Salat'],0,'Eine Verteilung, kein Verbot.'],
    ['Die Waage schwankt täglich um ein Kilo. Was zählt?',['Jeder einzelne Wert','Der Trend über Wochen','Nur der Montagswert'],1,'Tägliche Werte schwanken vor allem durch Wasser.']]});

ARC('klinge',{n:'Arc VI · Klinge',comp:'Fokus & Deep Work',title:'Fokusklinge',stat:'FOC',
  d:'Konzentration als Fähigkeit: warum Wechsel teuer sind, wie du dein Handy entschärfst, mit Zeitblöcken arbeitest und Pausen richtig nutzt.',
  ch:[
  CH('Der Preis des Wechselns','Wenn du von einer Aufgabe zur nächsten springst, bleibt ein Teil deiner Aufmerksamkeit bei der alten hängen – Forscher nennen das Aufmerksamkeitsrest. „Multitasking“ ist meist schnelles Hin- und Herschalten, und jeder Wechsel kostet Zeit und Qualität.',
    'Du schreibst eine Arbeit und beantwortest nebenbei jede Nachricht sofort. Was passiert am ehesten?',['Du schaffst beides gleichzeitig gut','Beides wird langsamer und schlechter, weil du ständig umschaltest','Nichts, du bist ein Multitasker'],1,
    'Wo ist deine Aufmerksamkeit in der Minute nach dem Lesen einer Nachricht – bei der Arbeit oder noch bei der Nachricht?','Jeder Wechsel hinterlässt einen Rest. Gebündelte Antwortzeiten schützen die tiefe Arbeit.',
    'Leg heute zwei feste Zeiten fest, zu denen du Nachrichten beantwortest – und dazwischen nicht.'),
  CH('Das Handy entschärfen','Benachrichtigungen unterbrechen dich, und schon ein sichtbares Handy kann ablenken. Am wirksamsten ist Abstand: Handy in einen anderen Raum, Benachrichtigungen aus, Nicht-stören-Modus während Fokuszeiten. Was du nicht siehst, musst du nicht ignorieren.',
    'Was hilft am meisten für einen konzentrierten Lernblock?',['Handy umgedreht neben dir','Handy auf lautlos in der Hosentasche','Handy in einem anderen Raum'],2,
    'Bei welcher Variante musst du am wenigsten Kraft aufwenden, um nicht doch hinzuschauen?','Abstand schlägt Willenskraft – wie bei allen Gewohnheiten.',
    'Schalte heute für alle Apps außer Anrufen und wichtigen Kontakten die Benachrichtigungen aus.'),
  CH('Zeitblöcke','Plane tiefe Arbeit wie einen Termin: ein Block, eine Aufgabe, ein klares Ziel. Die Pomodoro-Methode (25 Minuten Arbeit, 5 Minuten Pause) eignet sich gut zum Einstieg. Später kannst du auf 50 oder 90 Minuten verlängern.',
    'Du willst „heute irgendwann“ an deinem Projekt arbeiten. Wie stehen die Chancen am besten?',['Warten, bis du Lust hast','Einen festen Block von 10 bis 11 Uhr mit einer klaren Aufgabe eintragen','So lange arbeiten, bis du fertig bist'],1,
    'Was passiert mit „irgendwann“, wenn der Tag voll wird?','Was keinen Platz im Kalender hat, verliert gegen alles, was einen hat.',
    'Mach heute einen Fokusblock mit dem Fokus-Timer und entscheide vorher genau, was am Ende fertig sein soll.'),
  CH('Eine Sache','Schreib vor jedem Block auf, was genau du tust – „Kapitel 3 zusammenfassen“, nicht „lernen“. Taucht ein anderer Gedanke auf, notiere ihn auf einem Zettel und mach weiter. So verlierst du ihn nicht und bleibst trotzdem im Block.',
    'Mitten im Fokusblock fällt dir ein, dass du noch einen Termin vereinbaren musst. Was tust du?',['Sofort erledigen, sonst vergisst du es','Kurz auf einen Zettel notieren und weiterarbeiten','Den Block abbrechen'],1,
    'Wie kannst du den Gedanken sichern, ohne den Block zu unterbrechen?','Ein „Gedankenparkplatz“ entlastet den Kopf, ohne dich aus der Arbeit zu reißen.',
    'Leg einen Zettel neben deinen Arbeitsplatz als Gedankenparkplatz und nutze ihn im nächsten Fokusblock.'),
  CH('Pausen und Energie','Konzentration ist begrenzt. Echte Pausen – aufstehen, bewegen, aus dem Fenster schauen – erholen besser als Handy-Pausen, bei denen dein Kopf weiter Reize verarbeitet. Wer pausiert, hält die Leistung über den Tag länger.',
    'Du hast 5 Minuten Pause zwischen zwei Blöcken. Was erholt dich am meisten?',['Social Media checken','Aufstehen, etwas trinken, kurz ans Fenster oder raus','Gleich weiterarbeiten'],1,
    'Bekommt dein Gehirn beim Scrollen eine Pause – oder nur andere Arbeit?','Bewegung und Reizarmut erholen. Scrollen ist für das Gehirn keine Pause.',
    'Mach heute zwischen zwei Aufgaben eine 5-Minuten-Pause ganz ohne Bildschirm.')],
  exam:[
    ['Was ist Aufmerksamkeitsrest?',['Konzentration, die nach einem Wechsel noch an der alten Aufgabe hängt','Restliche Energie am Abend','Eine App'],0,'Wechsel kosten Aufmerksamkeit.'],
    ['Wo liegt das Handy am besten während Fokuszeit?',['Umgedreht auf dem Tisch','In einem anderen Raum','In der Hand'],1,'Abstand schlägt Willenskraft.'],
    ['Was ist die Pomodoro-Methode?',['25 Minuten Arbeit, 5 Minuten Pause','Nur morgens arbeiten','Eine Ernährungsform'],0,'Ein einfacher Einstieg in Fokusblöcke.'],
    ['Welche Pause erholt am meisten?',['Scrollen','Aufstehen und bewegen','Nachrichten beantworten'],1,'Reizarme, bewegte Pausen erholen.']]});

ARC('gedaechtnis',{n:'Arc VII · Gedächtnis',comp:'Lernen lernen',title:'Gelehrter',stat:'INT',
  d:'Die wirksamsten Lernmethoden: Abrufen statt Wiederlesen, verteilt wiederholen, Themen mischen, erklären – und schlafen.',
  ch:[
  CH('Abrufen statt Wiederlesen','Wiederlesen fühlt sich produktiv an, weil der Text vertraut wirkt. Aber Wiedererkennen ist nicht Erinnern. Wer sich selbst abfragt (Active Recall), behält in Studien deutlich mehr. Anstrengung beim Abrufen ist ein Zeichen, dass es wirkt.',
    'Du hast ein Kapitel zweimal gelesen und alles kommt dir bekannt vor. Was weißt du jetzt sicher?',['Dass ich es abrufen kann','Nur, dass es vertraut wirkt – ob ich es abrufen kann, weiß ich noch nicht','Dass ich es ein drittes Mal lesen sollte'],1,
    'Woher weißt du heute, dass du morgen ohne Buch antworten kannst?','Erst ein Test ohne Unterlagen zeigt, was wirklich sitzt.',
    'Schreib zu etwas, das du diese Woche gelernt hast, fünf Fragen auf und beantworte sie ohne Unterlagen.'),
  CH('Verteilt wiederholen','Wiederholen kurz bevor du vergisst, festigt am stärksten (Spaced Repetition). Statt alles an einem Abend zu pauken, verteile das Lernen: zum Beispiel nach einem Tag, drei Tagen, einer Woche und zwei Wochen.',
    'Du hast zehn Stunden für eine Prüfung in zwei Wochen. Was ist am wirksamsten?',['Zehn Stunden am Abend davor','Zehn Tage lang je eine Stunde mit Wiederholungen','Fünf Stunden lesen, fünf Stunden markieren'],1,
    'Was passiert mit dem Gelernten zwischen den Sitzungen – und warum ist genau das nützlich?','Leichtes Vergessen zwischen Wiederholungen macht das erneute Abrufen wirksamer.',
    'Erstell zehn Karteikarten zu einem Thema und trag dir Wiederholungstermine in 1, 3 und 7 Tagen ein.'),
  CH('Mischen','Beim Üben verschiedene Aufgabentypen zu mischen (Interleaving) fühlt sich schwerer an als Blöcke mit nur einem Typ. Dafür lernst du zu erkennen, welche Methode wann passt – genau das wird in Prüfungen und im echten Leben verlangt.',
    'Du übst Matheaufgaben. Welche Reihenfolge bereitet dich am besten auf die Prüfung vor?',['Erst 20 Aufgaben Typ A, dann 20 Typ B','Typ A, B und C gemischt','Nur Typ A, den kannst du am besten'],1,
    'Was musst du in der Prüfung zuerst erkennen, bevor du überhaupt rechnen kannst?','Gemischtes Üben trainiert das Erkennen des Aufgabentyps, nicht nur das Ausführen.',
    'Mach heute eine Lerneinheit, in der du zwei oder drei Themen abwechselst.'),
  CH('Erklären','Erkläre ein Thema so, dass ein zwölfjähriges Kind es versteht (Feynman-Methode). Wo du ins Stocken gerätst oder Fachwörter brauchst, liegt deine Lücke. Wer Zusammenhänge erklärt („Warum ist das so?“), versteht tiefer.',
    'Du kannst eine Definition auswendig, scheiterst aber beim Erklären mit eigenen Worten. Was zeigt das?',['Alles gut, Auswendiglernen reicht','Du hast die Worte gelernt, aber noch nicht das Verständnis','Das Thema ist zu schwer für dich'],1,
    'Was wäre der Unterschied zwischen dir und einem Papagei, der die Definition aufsagen kann?','Verstehen zeigt sich, wenn du es in eigenen Worten und mit Beispielen erklären kannst.',
    'Erkläre heute einer Person oder schriftlich in fünf Sätzen ein Thema, das du gerade lernst.'),
  CH('Schlaf und Lernen','Im Schlaf verarbeitet und festigt das Gehirn Gelerntes. Eine durchlernte Nacht vor der Prüfung kostet oft mehr, als sie bringt: Müdigkeit verschlechtert das Abrufen genau dann, wenn es zählt. Lernen am Abend plus guter Schlaf ist eine starke Kombination.',
    'Prüfung morgen um 10 Uhr. Es ist 23 Uhr und du könntest noch zwei Stunden lernen. Was ist meist klüger?',['Bis 3 Uhr weiterlernen','Zehn Minuten die wichtigsten Fragen abrufen, dann schlafen','Kaffee trinken und durchmachen'],1,
    'Was braucht dein Gehirn morgen um 10 Uhr mehr: zwei Stunden mehr Stoff oder einen klaren Kopf, um abzurufen?','Kurzes Abrufen plus Schlaf schlägt Pauken plus Müdigkeit.',
    'Leg dir für deine nächste Lernphase eine feste Lern-Endzeit am Abend fest.')],
  exam:[
    ['Was ist Active Recall?',['Wissen aktiv aus dem Kopf abrufen, bevor man nachschaut','Text markieren','Schnell lesen'],0,'Abrufen ist die eigentliche Übung.'],
    ['Was macht Spaced Repetition?',['Alles an einem Tag lernen','Wiederholen in wachsenden Abständen','Nur einmal lesen'],1,'Verteilt wiederholen festigt nachhaltig.'],
    ['Warum Aufgabentypen mischen?',['Weil es leichter ist','Weil man lernt, den passenden Lösungsweg zu erkennen','Es bringt nichts'],1,'Interleaving trainiert das Erkennen.'],
    ['Welche Rolle spielt Schlaf beim Lernen?',['Keine','Er festigt Gelerntes','Er löscht Gelerntes'],1,'Schlaf hilft beim Festigen von Gedächtnisinhalten.']]});

ARC('sturm',{n:'Arc VIII · Sturm',comp:'Stress & Emotionen',title:'Ruhepol',stat:'WIL',
  d:'Mit Druck umgehen: wie Stress im Körper wirkt, wie Atmung beruhigt, wie du Gedanken prüfst, was Schreiben und Reden bewirken – und wann du dir Hilfe holst.',
  ch:[
  CH('Was Stress ist','Stress ist eine Reaktion des Körpers auf Herausforderung: Puls und Atmung steigen, du wirst wach und fokussiert. Kurzfristig ist das hilfreich. Belastend wird es, wenn der Stress dauerhaft bleibt und Erholung fehlt – dann leiden Schlaf, Stimmung und Gesundheit.',
    'Vor einer Präsentation klopft dein Herz und deine Hände sind kalt. Was bedeutet das?',['Dass du versagen wirst','Dass dein Körper dich auf eine Herausforderung vorbereitet','Dass du krank bist'],1,
    'Wofür braucht ein Körper, der gleich gefordert wird, mehr Puls und mehr Wachheit?','Die akute Stressreaktion ist Bereitschaft, nicht Schwäche. Wer sie so deutet, bleibt oft handlungsfähiger.',
    'Schreib drei Situationen dieser Woche auf, die dich gestresst haben, und daneben: kurz oder dauerhaft?'),
  CH('Atmen','Langsames Atmen mit verlängertem Ausatmen – zum Beispiel vier Sekunden ein, sechs aus – kann helfen, Puls und Anspannung zu senken. Es ist ein Werkzeug, das du überall dabei hast: vor einem Gespräch, in der Bahn, im Bett.',
    'Du bist vor einem schwierigen Gespräch angespannt. Was kannst du in zwei Minuten tun?',['Einen Energy-Drink trinken','Ein paar Runden langsam atmen: vier Sekunden ein, sechs aus','Das Gespräch absagen'],1,
    'Welcher Teil des Atems – Ein oder Aus – wirkt eher beruhigend?','Ein langes Ausatmen hilft vielen Menschen, schnell etwas ruhiger zu werden.',
    'Mach heute drei Minuten mit dem Meditations-Timer – vier Sekunden ein, sechs aus.'),
  CH('Gedanken prüfen','Oft stresst nicht die Situation, sondern wie wir sie deuten: „Ich habe einen Fehler gemacht, also bin ich unfähig.“ Prüfe solche Gedanken: Was spricht dafür, was dagegen? Was würde ich einem Freund sagen? Gibt es eine andere Erklärung?',
    'Eine Freundin antwortet seit Stunden nicht. Du denkst: „Sie ist sauer auf mich.“ Was ist ein hilfreicher nächster Schritt?',['Davon ausgehen und dich zurückziehen','Andere mögliche Erklärungen sammeln – und notfalls einfach nachfragen','Ihr eine wütende Nachricht schreiben'],1,
    'Welche anderen Gründe gibt es, warum jemand ein paar Stunden nicht antwortet?','Der erste Gedanke ist eine Hypothese, keine Tatsache. Alternativen zu prüfen senkt Stress und Missverständnisse.',
    'Schreib einen belastenden Gedanken von heute auf und daneben zwei andere mögliche Erklärungen.'),
  CH('Schreiben und Reden','Gedanken aufzuschreiben ordnet sie und kann entlasten. Mit Menschen zu reden, denen du vertraust, ist einer der stärksten Puffer gegen Stress. Du musst Probleme nicht allein tragen.',
    'Seit Tagen kreist ein Problem in deinem Kopf. Was hilft am ehesten?',['Es weiter allein durchdenken','Es aufschreiben und mit einer vertrauten Person darüber sprechen','Es verdrängen, bis es weg ist'],1,
    'Was verändert sich an einem Problem, wenn es aus deinem Kopf auf Papier oder in ein Gespräch kommt?','Ausdrücken schafft Abstand und Ordnung. Unterstützung durch andere entlastet nachweislich.',
    'Schreib heute einen Journal-Eintrag über das, was dich gerade am meisten beschäftigt.'),
  CH('Wann Hilfe holen','Wenn Niedergeschlagenheit, Angst oder Erschöpfung über Wochen anhalten, Schlaf und Alltag leiden oder dir Dinge keine Freude mehr machen, ist das ein Grund, mit einer Hausärztin oder einer Psychotherapeutin zu sprechen. In einer akuten Krise: Notruf 112 oder in Deutschland die Telefonseelsorge unter 0800 111 0 111 oder 0800 111 0 222, kostenlos und rund um die Uhr. Hilfe zu holen ist Stärke.',
    'Ein Freund wirkt seit Wochen leer, schläft schlecht und sagt alles ab. Was ist hilfreich?',['Ihm sagen, er soll sich zusammenreißen','Ihn ansprechen, zuhören und ermutigen, sich professionelle Hilfe zu holen','Abwarten, das geht vorbei'],1,
    'Was braucht jemand, dem es seit Wochen schlecht geht, mehr: einen Ratschlag oder jemanden, der da ist und einen Weg zur Hilfe zeigt?','Da sein, zuhören und den Weg zu Fachleuten erleichtern – das ist echte Unterstützung.',
    'Speichere die Nummer der Telefonseelsorge (0800 111 0 111) und die deiner Hausarztpraxis in deinem Handy.')],
  exam:[
    ['Wann wird Stress problematisch?',['Bei jeder Aufregung','Wenn er dauerhaft anhält und Erholung fehlt','Nie'],1,'Kurzer Stress ist normal und oft nützlich.'],
    ['Welche Atmung wirkt eher beruhigend?',['Kurz und schnell','Langsam mit verlängertem Ausatmen','Luft anhalten'],1,'Zum Beispiel vier Sekunden ein, sechs aus.'],
    ['Was heißt „Gedanken prüfen“?',['Gedanken unterdrücken','Fragen, was dafür und dagegen spricht und welche Erklärungen es noch gibt','Immer das Schlimmste annehmen'],1,'Gedanken sind Hypothesen.'],
    ['Wann ist professionelle Hilfe sinnvoll?',['Erst wenn gar nichts mehr geht','Wenn Belastung über Wochen anhält und den Alltag beeinträchtigt','Nie, man muss es allein schaffen'],1,'Früh Hilfe holen ist klug.']]});

ARC('klang',{n:'Arc IX · Klang',comp:'Musik & Kreativität',title:'Klangschmied',stat:'INT',
  d:'Musikalisches Handwerk für Komponisten: gezielt üben, Motive bauen, Harmoniefunktionen hören, Musik für Bilder schreiben und Werke fertig machen.',
  ch:[
  CH('Gezielt üben','Durchspielen, was man schon kann, fühlt sich gut an, bringt aber wenig. Gezieltes Üben heißt: die schwierige Stelle isolieren, langsam spielen, bis sie sauber ist, dann das Tempo steigern. Kurz und täglich ist wirksamer als selten und lang.',
    'Ein Stück klappt bis auf vier schwierige Takte. Wie übst du am wirksamsten?',['Das ganze Stück immer wieder durchspielen','Die vier Takte langsam isoliert üben, bis sie sauber sind','Schneller spielen, damit die Stelle schneller vorbei ist'],1,
    'Wie viel Zeit verbringst du beim Durchspielen tatsächlich mit den vier Takten, die du nicht kannst?','Die Arbeit gehört dorthin, wo es hakt. Langsam und sauber schlägt schnell und fehlerhaft.',
    'Übe heute 15 Minuten nur eine schwierige Stelle – halbes Tempo, bis sie dreimal fehlerfrei klappt.'),
  CH('Das Motiv','Ein Motiv ist die kleinste wiedererkennbare musikalische Idee – oft nur zwei bis acht Töne mit eigenem Rhythmus. In Filmmusik gehört es zu einer Figur oder Idee und verändert sich mit der Geschichte: langsamer, in Moll, anders instrumentiert.',
    'Dein Motiv hat elf Töne und niemand kann es nachsummen. Was probierst du zuerst?',['Lauter mischen','Auf die drei bis fünf stärksten Töne reduzieren','Mehr Instrumente dazu'],1,
    'Was macht etwas leichter zu merken – mehr oder weniger Information?','Reduktion macht Motive einprägsam. Die stärksten Themen sind oft erstaunlich kurz.',
    'Schreib ein Motiv aus höchstens fünf Tönen und nimm es mit dem Handy auf.'),
  CH('Harmonie hören','Akkorde haben Funktionen: Die Tonika fühlt sich nach Ankommen an, die Dominante nach Spannung, die Subdominante nach Aufbruch. In C-Dur: C (Tonika), F (Subdominante), G (Dominante). Wer diese Funktionen hört, kann Emotionen gezielt steuern.',
    'Am Ende einer Szene soll der Zuschauer spüren: Es ist noch nicht vorbei. Mit welchem Akkord endest du eher?',['Mit der Tonika – ganz geschlossen','Mit der Dominante – offen, voller Spannung','Mit Stille, egal welcher Akkord'],1,
    'Welcher Akkord will weitergehen, und welcher ist schon zu Hause angekommen?','Die Dominante erzeugt Erwartung. Ein Schluss darauf lässt die Frage offen.',
    'Spiele I – IV – V – I in C-Dur und dann in zwei anderen Tonarten. Achte darauf, wie sich jeder Akkord anfühlt.'),
  CH('Musik für Bilder','Filmmusik dient dem Bild. Achte auf Emotionswechsel in der Szene, setze Musik gezielt ein und manchmal bewusst aus. Stille kann stärker sein als jede Note. Die Musik muss nicht erklären, was man sieht – sie kann zeigen, was man nicht sieht.',
    'Eine Figur lächelt, aber du weißt, dass sie innerlich zerbricht. Was kann die Musik tun?',['Fröhlich sein, wie das Lächeln','Leise eine traurige Ebene unter das Lächeln legen','Laut und dramatisch werden'],1,
    'Was zeigt das Bild bereits – und was weiß nur die Musik?','Musik kann den Subtext hörbar machen. Sie doppelt nicht das Bild, sie ergänzt es.',
    'Schau 60 Sekunden einer Filmszene ohne Ton und notiere, wo sich die Emotion ändert und was du dort hören würdest.'),
  CH('Fertig machen','Unfertige Stücke lehren dich wenig. Gib dir Deadlines, begrenze die Länge und mach Dinge fertig, auch wenn sie nicht perfekt sind. Feedback von anderen zeigt dir, was du selbst überhörst. Masse führt zu Klasse.',
    'Du arbeitest seit drei Monaten an einem 60-Sekunden-Stück und findest es nie gut genug. Was hilft am meisten?',['Weiter perfektionieren','Eine Deadline setzen, fertig machen, jemandem zeigen und das nächste beginnen','Neu anfangen mit einer anderen Idee'],1,
    'Was lernst du aus einem fertigen, unperfekten Stück, das du aus einem ewig unfertigen nicht lernst?','Fertigstellen ist eine eigene Fähigkeit – und sie wächst nur durch Fertigstellen.',
    'Setz dir für ein aktuelles Stück eine Deadline in sieben Tagen und trag sie in deinen Kalender ein.')],
  exam:[
    ['Was ist gezieltes Üben?',['Das ganze Stück oft durchspielen','Schwierige Stellen isoliert und langsam üben','Nur Lieblingsstellen spielen'],1,'Die Arbeit gehört an die schwierigen Stellen.'],
    ['Was macht ein Motiv einprägsam?',['Viele Töne','Kürze und ein klarer Rhythmus','Laute Mischung'],1,'Weniger ist oft mehr.'],
    ['Welcher Akkord ist in C-Dur die Dominante?',['C','F','G'],2,'G ist die fünfte Stufe und erzeugt Spannung.'],
    ['Was kann Filmmusik zusätzlich zum Bild zeigen?',['Nur, was man sieht','Den Subtext – was eine Figur fühlt, aber nicht zeigt','Nichts'],1,'Musik kann Unsichtbares hörbar machen.']]});

ARC('wert',{n:'Arc X · Wert',comp:'Business-Grundlagen',title:'Wertschöpfer',stat:'INT',
  d:'Wie aus Ideen etwas wird, wofür Menschen bezahlen: Probleme finden, richtig fragen, klein bauen, Preise setzen und verkaufen.',
  ch:[
  CH('Problem zuerst','Viele Ideen scheitern nicht an der Umsetzung, sondern daran, dass niemand das Problem dringend genug hat. Ein gutes Problem ist häufig, schmerzhaft und wird schon jetzt mit Geld, Zeit oder Nerven bezahlt.',
    'Welches Signal spricht am stärksten für ein echtes Problem?',['„Coole Idee, würde ich vielleicht nutzen.“','Die Person hat schon Geld oder Zeit ausgegeben, um es zu lösen','Viele Likes auf einen Post'],1,
    'Welche der drei Reaktionen hat die Person tatsächlich etwas gekostet?','Verhalten schlägt Meinung. Wer schon zahlt, hat echten Schmerz.',
    'Schreib drei Probleme auf, die du bei echten Menschen in den letzten zwei Wochen beobachtet hast: Wer? Wie oft? Was kostet es sie heute?'),
  CH('Richtig fragen','Menschen sind höflich und sagen dir, was du hören willst. Frag deshalb nicht nach Meinungen zu deiner Idee, sondern nach ihrer Vergangenheit: „Wann ist dir das zuletzt passiert? Was hast du dann gemacht? Was hat es gekostet?“',
    'Welche Frage liefert die ehrlichste Information?',['„Würdest du meine App kaufen?“','„Wann ist dir das zuletzt passiert, und was hast du dann gemacht?“','„Findest du die Idee gut?“'],1,
    'Welche Frage beantwortet die Person mit Fakten aus ihrem Leben statt mit Höflichkeit?','Fragen nach konkreter Vergangenheit liefern Daten. Fragen nach Meinungen liefern Komplimente.',
    'Führe ein kurzes Gespräch mit einer Person über ein Problem aus deiner Liste – ohne deine Idee zu erwähnen.'),
  CH('Klein bauen','Ein MVP ist die kleinste Version, mit der du testen kannst, ob jemand dein Angebot will: eine Seite, ein Mockup, eine Dienstleistung von Hand. Je früher echte Menschen reagieren, desto weniger Zeit verschwendest du.',
    'Du hast eine App-Idee. Was ist der klügste erste Schritt?',['Sechs Monate programmieren','Die Lösung von Hand für drei Menschen anbieten und schauen, ob sie sie wollen','Ein Logo entwerfen'],1,
    'Was ist das Kleinste, womit du herausfinden kannst, ob jemand das wirklich will?','Erst Nachfrage beweisen, dann bauen. Handarbeit am Anfang ist kein Makel, sondern Forschung.',
    'Beschreib auf einer Seite die kleinste Version deiner Idee, die jemandem schon heute helfen würde.'),
  CH('Preis und Wert','Ein Preis orientiert sich am Wert für den Kunden, nicht an deiner Unsicherheit. Zu niedrige Preise ziehen oft schwierige Kunden an und lassen dich ausbrennen. Ein klares Angebot mit Umfang, Preis und Zeitraum schützt beide Seiten.',
    'Ein Kunde will Musik für einen Kurzfilm, Budget 150 €. Was ist professionell?',['Alles machen, was er sich wünscht','Klar festlegen: was für 150 € enthalten ist, wie viele Korrekturen, bis wann – und was mehr kostet','Sofort absagen'],1,
    'Was passiert ohne klaren Umfang, wenn der Kunde immer mehr wünscht?','Klare Absprachen verhindern unbezahlte Mehrarbeit und Streit.',
    'Formuliere ein Angebot in drei Zeilen: Was bekommt der Kunde? Zu welchem Preis? Bis wann?'),
  CH('Verkaufen','Verkaufen heißt vor allem: zuhören, das Problem verstehen und dann ehrlich zeigen, wie du helfen kannst. Ein Nein ist keine Niederlage, sondern eine Information. Wer nie nach dem Auftrag fragt, bekommt ihn selten.',
    'Nach einem guten Gespräch zögert die Person. Was tust du?',['Nichts sagen und hoffen','Freundlich direkt fragen: „Soll ich dir ein Angebot schicken?“','Den Preis halbieren'],1,
    'Wie soll die Person zusagen, wenn du nie fragst?','Eine klare Frage gibt dem Gegenüber die Chance, Ja oder Nein zu sagen – beides bringt dich weiter.',
    'Frag heute eine Person nach etwas, bei dem ein Nein wahrscheinlich ist. Ziel ist nicht das Ja, sondern das Fragen.')],
  exam:[
    ['Woran erkennst du ein echtes Problem?',['Viele Likes','Menschen geben schon Geld oder Zeit aus, um es zu lösen','Freunde finden die Idee gut'],1,'Verhalten schlägt Meinung.'],
    ['Welche Frage ist im Kundengespräch am besten?',['„Würdest du das kaufen?“','„Wann ist dir das zuletzt passiert?“','„Ist die Idee gut?“'],1,'Nach der Vergangenheit fragen.'],
    ['Was ist ein MVP?',['Das fertige Produkt','Die kleinste Version, mit der man Nachfrage testen kann','Ein Logo'],1,'Erst testen, dann bauen.'],
    ['Woran orientiert sich ein guter Preis?',['Am Wert für den Kunden','Am niedrigsten Konkurrenzpreis','An deiner Unsicherheit'],0,'Wert schlägt Angst.']]});

/* ==== 30_engine.js ==== */

/* ============================================================
   ENGINE: program days, quests, XP, ranks, streaks, penalties
   ============================================================ */
function progDay(d){return dayDiff(S.start,d||todayKey())+1}
function phaseOf(pd){return pd<=22?0:pd<=44?1:2}
function qTier(q,d){return Math.max(phaseOf(clamp(progDay(d),1,PDAYS)),q.tb||0)}
function questsFor(d){const w=wdOf(d);return S.quests.filter(q=>q.days.includes(w)&&(!q.since||q.since<=d))}
function qTarget(q,d){return q.type==='check'?1:q.tiers[qTier(q,d)]}
function qVal(q,d){const L=S.log[d];return L&&L.p[q.id]||0}
function qDone(q,d){return qVal(q,d)>=qTarget(q,d)}
function qXP(q,d){return Math.round(q.xp*TIER_MULT[qTier(q,d)])}
function hm(min){const h=Math.floor(min/60),m=min%60;return h?(m?`${h} h ${m}`:`${h} h`):`${m} min`}
function qLabel(q,d){
  if(q.type==='count')return `${fmtN(qVal(q,d))} / ${fmtN(qTarget(q,d))} ${q.unit}`;
  if(q.limit)return `unter ${hm(q.limit[qTier(q,d)])} am Handy`;
  return qDone(q,d)?'erledigt':'offen';
}
function dayLog(d){return S.log[d]||(S.log[d]={p:{},aw:{},bonus:0,card:null,rest:false,pen:null})}
function penOpen(L){return !!(S.hard&&L&&L.pen&&!L.pen.done)}
function dayState(d){
  const L=S.log[d],qs=questsFor(d),done=qs.filter(q=>qDone(q,d)).length;
  return{qs,done,total:qs.length,rest:!!(L&&L.rest),pen:L&&L.pen,cleared:!!(L&&L.bonus>0)};
}

/* ---------- level & rank ---------- */
const xpNeed=L=>50+20*L+3*L*L;
function levelInfo(xp){let L=1,r=xp==null?S.xp:xp;while(r>=xpNeed(L)){r-=xpNeed(L);L++}return{L,into:r,need:xpNeed(L)}}
function rankIdx(L){L=L||levelInfo().L;let i=0;RANKS.forEach((r,j)=>{if(L>=r.min)i=j});return i}
function addXP(n,label){
  const b=levelInfo().L,br=rankIdx(b);
  S.xp=Math.max(0,S.xp+n);
  S.hist.unshift({d:todayKey(),l:label,x:n});S.hist=S.hist.slice(0,60);
  const a=levelInfo().L;
  if(a>b){const ar=rankIdx(a);ui.ov.push({type:'level',L:a,rank:ar>br?ar:null})}
}
function loseXP(n){const lv=levelInfo();const floor=S.xp-lv.into;const nx=Math.max(floor,S.xp-n);const lost=S.xp-nx;S.xp=nx;if(lost)S.hist.unshift({d:todayKey(),l:'Strafe: verpasster Tag',x:-lost});return lost}
function gainStat(k,v){S.stats[k]=clamp((S.stats[k]||0)+v,0,99)}

/* ---------- quest progress ---------- */
function setQ(qid,val){
  const d=todayKey(),L=dayLog(d),q=S.quests.find(x=>x.id===qid);
  if(!q||L.rest)return false;
  const before=qDone(q,d);
  L.p[qid]=Math.max(0,Math.round(val));
  const after=qDone(q,d);
  if(!before&&after){const xp=qXP(q,d);L.aw[qid]=xp;addXP(xp,q.n);gainStat(q.stat,STAT_GAIN[qTier(q,d)]);S.flags.anyQuest=1}
  if(before&&!after){const xp=L.aw[qid]||0;addXP(-xp,q.n+' zurückgenommen');gainStat(q.stat,-STAT_GAIN[qTier(q,d)]);delete L.aw[qid]}
  checkClear(d);
  return true;
}
function bumpLib(lib,amount,mode){
  const d=todayKey();const q=questsFor(d).find(x=>x.lib===lib);if(!q)return null;
  const v=qVal(q,d);
  const nv=mode==='set'?amount:mode==='check'?(amount?1:0):v+amount;
  if(nv===v)return q;
  setQ(q.id,nv);return q;
}
function checkClear(d){
  const L=dayLog(d),st=dayState(d);
  const isClear=st.total>0&&st.done===st.total&&!penOpen(L)&&!L.rest;
  if(isClear&&!L.bonus){
    const s=streak()+1;
    let bonus=50+Math.min(s*5,50);const rows=[['Tagesbonus','+50 XP']];
    if(s>1)rows.push([`Streak ${s}`,`+${Math.min(s*5,50)} XP`]);
    if(S.returnBonus){bonus+=20;rows.push(['Rückkehr','+20 XP']);S.returnBonus=false;S.flags.comeback=1}
    L.bonus=bonus;addXP(bonus,`Tag ${progDay(d)} abgeschlossen`);
    if(s>S.best)S.best=s;

function isClearDay(d){const L=S.log[d];return !!(L&&L.bonus>0)}
function streak(){
  const t=todayKey();let d=isClearDay(t)?t:shiftDay(t,-1);let n=0;const stop=S.firstStart||S.start;
  for(let i=0;i<4000&&d>=stop;i++){
    const L=S.log[d];
    if(L&&L.bonus>0)n++;

function clearedCount(all){return Object.keys(S.log).filter(d=>(all||d>=S.start)&&S.log[d].bonus>0).length}
function missedCount(all){return Object.keys(S.log).filter(d=>(all||d>=S.start)&&S.log[d].missed).length}
function restCount(all){return Object.keys(S.log).filter(d=>(all||d>=S.start)&&S.log[d].rest).length}

/* ---------- day evaluation: missed days, penalties, phases ---------- */
function evaluateDays(){

        dayLog(d).missed=true;missed.push(progDay(d));
        if(S.hard){const poss=qs.reduce((a,q)=>a+qXP(q,d),0)+50;lost+=loseXP(Math.round(poss*.5));S.penCarry={...pick(PENALTIES,rng(d+'pen')),done:false}}
        else S.returnBonus=true;
      }
    }
    d=shiftDay(d,1);
  }
  if(S.evalUntil!==y){S.evalUntil=y;changed=true}
  if(missed.length){
    changed=true;
    const days=missed.length>4?`${missed.length} Tage (Tag ${missed[0]}–${missed[missed.length-1]})`:(missed.length>1?'Tag '+missed.join(', '):'Tag '+missed[0]);
    if(S.hard)S.notices.push({type:'sys',tone:'red',t:'Strafe',lines:[`${days} nicht abgeschlossen.`,`−${lost} XP.`,'Streak zurückgesetzt.','Heute wartet eine Strafquest.']});
    else S.notices.push({type:'sys',tone:'ice',t:'Tag verpasst',lines:[`${days} nicht abgeschlossen.`,'Dein Streak beginnt neu.','Rückkehr wird belohnt: +20 XP, wenn du heute alle Quests schaffst.']});
  }
  if(S.penCarry&&S.hard){const L=dayLog(t);if(!L.pen&&!L.rest){L.pen=S.penCarry;S.penCarry=null;changed=true}}
  const pd=progDay(t);
  if(pd<=PDAYS){const ph=phaseOf(pd);if(S.lastPhase!==ph){if(S.lastPhase!=null){const P=PHASES[ph];
      S.notices.push({type:'sys',tone:'ice',t:`${P.n} · ${P.t}`,lines:[P.d,...questsFor(t).filter(q=>q.type==='count').map(q=>`${q.n}: jetzt ${fmtN(qTarget(q,t))} ${q.unit}`)]})}
    S.lastPhase=ph;changed=true}}
  if(S.arcs&&S.arcs.active&&pd>arcLen()){finishArcCheck();changed=true}
  if(changed){save();checkAch()}
}

/* ---------- cards ---------- */
function cardOdds(s){return s>=21?[40,35,18,7]:s>=7?[55,28,13,4]:[70,22,7,1]}
function drawCard(d){
  const L=dayLog(d);if(L.card)return CI[L.card];
  const odds=cardOdds(streak());let x=rand()*100,r=0;for(let i=0;i<4;i++){if(x<odds[i]){r=i;break}x-=odds[i];r=i}
  const pool=CARDS.filter(c=>c.r===r);const fresh=pool.filter(c=>!S.cards[c.id]);
  let c;
  if(fresh.length&&rand()<.85)c=pick(fresh);else c=pick(pool);
  L.card=c.id;
  if(S.cards[c.id]){S.dups++;addXP(15,'Doppelte Karte');L.dup=true}else S.cards[c.id]=d;
  checkAch();save();return c;
}

  let xp=0;got.forEach(a=>xp+=a.xp);

/* ---------- program setup ---------- */
function makeQuest(lib,a){
  const L=QL[lib];const q={id:lib,lib,n:L.n,stat:L.stat,type:L.type,unit:L.unit||'',xp:L.xp,days:(L.days||ALL_DAYS).slice()};
  if(L.tiers){let f=1;if(L.scale==='lift')f=[1,1.2,1.5,1.8][(a&&a.lift)||0];if(L.scale==='move')f=[1,1.1,1.25,1.4][(a&&a.move)||0];
    q.tiers=L.tiers.map(v=>{const x=v*f;const step=v>=1000?500:v>=20?5:1;return Math.max(step,Math.round(x/step)*step)})}
  if(L.limit)q.limit=L.limit.slice();
  return q;
}
function assessStats(a){
  const s={STR:5,END:5,VIT:5,INT:5,FOC:5,WIL:5};
  for(const Q of ASSESS){const v=a[Q.k]||0;for(const k in Q.g)s[k]+=v*Q.g[k]}
  for(const k in s)s[k]=clamp(Math.round(s[k]),3,30);
  return s;
}
function recommend(goals,stats,time){
  const n=(TIMES.find(t=>t[0]===time)||TIMES[1])[2];
  const weak=Object.entries(stats).sort((x,y)=>x[1]-y[1]).slice(0,2).map(x=>x[0]);
  const score={};
  for(const g of goals){const G=GOALS.find(x=>x.id===g);if(G)G.q.forEach((q,i)=>score[q]=(score[q]||0)+3-i*.3)}
  for(const q of QLIB)if(weak.includes(q.stat))score[q.lib]=(score[q.lib]||0)+1.5;
  const list=Object.entries(score).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
  const out=[],per={};
  for(const id of list){if(out.length>=n)break;const q=QL[id];if((per[q.stat]||0)>=2)continue;out.push(id);per[q.stat]=(per[q.stat]||0)+1}
  if(!out.some(id=>['STR','END'].includes(QL[id].stat))){if(out.length>=n)out.pop();out.push('steps')}
  for(const id of ['water','read','steps','journal','bedtime','pushups']){if(out.length>=n)break;if(!out.includes(id))out.push(id)}
  return out;
}
function weakStrong(stats){const e=Object.entries(stats).sort((x,y)=>y[1]-x[1]);return{strong:e.slice(0,2).map(x=>x[0]),weak:e.slice(-2).reverse().map(x=>x[0])}}

/* ============================================================
   STATUS: Statusfenster, Stats-Radar, 66-Tage-Raster, Erfolge
   ============================================================ */
function radar(stats,size){
  size=size||300;const cx=150,cy=150,R=100;const keys=STAT_KEYS;
  const max=Math.max(30,Math.ceil(Math.max(...keys.map(k=>stats[k]||0))/10)*10);
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;return[cx+Math.cos(a)*R*v/max,cy+Math.sin(a)*R*v/max]};
  let g='';
  for(const f of [.25,.5,.75,1]){g+=`<polygon points="${keys.map((k,i)=>pt(i,max*f).join(',')).join(' ')}" fill="none" stroke="#1c2e4c" stroke-width="1"/>`}
  keys.forEach((k,i)=>{const [x,y]=pt(i,max);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1c2e4c" stroke-width="1"/>`});
  const poly=keys.map((k,i)=>pt(i,Math.max(1,stats[k]||0)).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="rgba(130,200,255,.18)" stroke="#82c8ff" stroke-width="2" stroke-linejoin="round"/>`;
  keys.forEach((k,i)=>{const [x,y]=pt(i,Math.max(1,stats[k]||0));g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${STATS[k].c}"/>`});
  keys.forEach((k,i)=>{const [x,y]=pt(i,max*1.22);g+=`<text x="${x}" y="${y-4}" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="12" fill="${STATS[k].c}">${STATS[k].code}</text><text x="${x}" y="${y+11}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e7eefb">${Math.floor(stats[k]||0)}</text>`});
  return `<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="Stats: ${keys.map(k=>STATS[k].n+' '+Math.floor(stats[k]||0)).join(', ')}">${g}</svg>`;
}
function statBars(stats){
  const max=Math.max(30,...STAT_KEYS.map(k=>stats[k]||0));
  return `<div class="stack" style="gap:8px">${STAT_KEYS.map(k=>{const s=STATS[k],v=stats[k]||0;return `<div class="stat" style="--c:${s.c}"><span class="code">${s.code}</span><div class="bar thin"><i style="width:${v/max*100}%"></i></div><span class="mono">${Math.floor(v)}</span></div>`}).join('')}</div>`;
}
function renderStatus(){
  const lv=levelInfo(),ri=rankIdx(lv.L),R=RANKS[ri],t=todayKey();
  const power=Math.floor(STAT_KEYS.reduce((a,k)=>a+(S.stats[k]||0),0));
  const totalQ=Object.values(S.log).reduce((a,L)=>a+Object.keys(L.aw||{}).length,0);
  const next=RANKS[ri+1];
  let h=`<section class="win sys">
    <div class="win-h">Status<button class="gear" data-a="settings" aria-label="Einstellungen" style="margin:-12px -8px -12px auto">${GEAR}</button></div>
    <div class="row" style="gap:16px;align-items:center">${rankBadge(ri,76)}
      <div class="grow"><div class="h1">${esc(S.profile.name)}</div>${S.title?`<div class="sys" style="color:${R.c};font-weight:700;letter-spacing:.08em">${esc(S.title)}</div>`:''}
      <div class="mono small muted">LV ${lv.L} · Rang ${R.r} · ${fmtN(S.xp)} XP gesamt</div></div></div>
    <div class="kv" style="margin-top:14px">${S.arcs&&S.arcs.active?`<span>Arc</span><span>${esc(AI_[S.arcs.active].n)}</span><span>Arc-Tag</span><span>${Math.min(progDay(t),arcLen())} / ${arcLen()}</span>`:`<span>Arc</span><span>keiner aktiv</span>`}<span>Kompetenzen</span><span>${Object.keys(S.arcs.done||{}).length} / ${ARCS.length}</span><span>Gesamtstärke</span><span>${power}</span>${next?`<span>Nächster Rang</span><span>${next.r} ab LV ${next.min}</span>`:''}<span>Modus</span><span style="color:${S.hard?'var(--red)':'var(--ice)'}">${S.hard?'Hard Mode':'Normal'}</span></div>
  </section>
  <section class="win"><div class="win-h">Stats</div>${radar(S.stats)}${statBars(S.stats)}<p class="note" style="margin-top:10px">Stats wachsen durch erledigte Quests, Arc-Kapitel und abgeschlossene Arcs. Jede Quest trainiert den Wert, der neben ihr steht.</p></section>
  ${renderCompetences()}
  <section class="win"><div class="win-h">${S.arcs&&S.arcs.active?'Arc-Tage':'Letzter Arc'}<span class="r">${clearedCount()} geschafft</span></div>
    <div class="grid66" role="img" aria-label="${clearedCount()} von ${arcLen()} Tagen abgeschlossen">${cycleDays().map(d=>{const L=S.log[d];let c='';if(L&&L.bonus>0)c='ok';else if(L&&L.rest)c='rest';else if(L&&L.missed)c='miss';if(d===t)c+=' today';return `<i class="${c}" title="Tag ${progDay(d)} · ${fmtDate(d)}"></i>`}).join('')}</div>
    <div class="row wrap" style="gap:12px;margin-top:10px"><span class="note"><span style="color:var(--green)">■</span> geschafft</span><span class="note"><span style="color:var(--red)">■</span> verpasst</span><span class="note"><span style="color:var(--ice)">▨</span> Schontag</span></div></section>
  <section class="win"><div class="win-h">Rekorde</div><div class="kv">
    <span>Tage abgeschlossen</span><span>${clearedCount(true)}</span><span>Verpasst</span><span>${missedCount(true)}</span><span>Schontage</span><span>${restCount(true)}</span>
    <span>Aktueller Streak</span><span>${streak()}</span><span>Bester Streak</span><span>${S.best}</span><span>Quests erledigt</span><span>${totalQ}</span><span>Karten</span><span>${Object.keys(S.cards).length} / ${CARDS.length}</span></div></section>`;
  if(S.titles.length)h+=`<section class="win"><div class="win-h">Titel</div><div class="chips">${S.titles.map(x=>`<button class="chip" data-a="title" data-v="${esc(x)}" aria-pressed="${S.title===x}">${esc(x)}</button>`).join('')}</div><p class="note" style="margin-top:8px">Der gewählte Titel steht unter deinem Namen.</p></section>`;
  h+=`<section class="win"><div class="win-h">Erfolge<span class="r">${Object.keys(S.ach).length}/${ACH.length}</span></div>${ACH.map(a=>`<div class="ach ${S.ach[a.id]?'':'lock'}"><b>${esc(a.n)}</b><span class="mono small" style="color:${S.ach[a.id]?'var(--gold)':'var(--faint)'}">${S.ach[a.id]?fmtDate(S.ach[a.id]):a.xp?'+'+a.xp+' XP':''}</span><span class="note">${esc(a.d)}${a.title?` · Titel: ${esc(a.title)}`:''}</span></div>`).join('')}</section>`;
  h+=`<section class="win"><div class="win-h">Verlauf</div>${S.hist.length?`<div class="hist">${S.hist.slice(0,15).map(x=>`<span>${esc(x.l)} <span class="note">· ${fmtDate(x.d)}</span></span><span class="mono" style="${x.x<0?'color:var(--red)':''}">${x.x>0?'+':''}${x.x}</span>`).join('')}</div>`:'<p class="note">Deine Reise beginnt hier.</p>'}</section>`;
  return h;
}

/* ---------- timers ---------- */
let audioCtx=null,wakeLock=null;
function initAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(){try{if(!audioCtx)return;[0,.25].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=740;g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.5);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.55)})}catch(e){}}
async function lockScreen(){try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function unlockScreen(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function startTimer(kind,min){initAudio();S.tools[kind].run={start:Date.now(),dur:min*60,min,paused:null};lockScreen();save();keepScroll(render)}
ACTIONS['tm-start']=ds=>startTimer(ds.k,+ds.v);
ACTIONS['tm-pause']=ds=>{const r=S.tools[ds.k].run;if(!r)return;if(r.paused!=null){r.start=Date.now()-(r.dur-r.paused)*1000;r.paused=null;lockScreen()}else{r.paused=timerLeft(r);unlockScreen()}save();keepScroll(render)};
ACTIONS['tm-stop']=ds=>{S.tools[ds.k].run=null;unlockScreen();save();keepScroll(render)};
function finishTimer(kind){
  const r=S.tools[kind].run;if(!r)return;S.tools[kind].run=null;unlockScreen();beep();
  const d=todayKey();
  if(kind==='focus'){S.tools.focus.log.push({d,min:r.min});const q=bumpLib('focus',1,'add');if(!q)addXP(10,'Fokusblock');toast(`<b>Fokusblock abgeschlossen</b> · ${r.min} min${q?' · Quest aktualisiert':' · +10 XP'}`)}
  else{S.tools.med.log.push({d,min:r.min});const q=bumpLib('meditate',r.min,'add');if(!q)addXP(5,'Meditation');toast(`<b>Meditation abgeschlossen</b> · ${r.min} min`)}
  checkAch();save();render();
}
setInterval(()=>{
  for(const k of ['focus','med']){const r=S.tools[k].run;if(!r)continue;const left=timerLeft(r);
    if(left<=0&&r.paused==null){finishTimer(k);continue}

    const tile=document.querySelector(`[data-timer-tile="${k}"]`);if(tile)tile.textContent='läuft · '+mmss(left);
    if(k==='med'){const b=document.getElementById('breath-l');if(b){const el2=(r.dur-left)%10;b.textContent=r.paused!=null?'Pause':el2<4?'Einatmen':'Ausatmen'}}
  }
},500);

  return `<div class="win sys stack">${kind==='med'?`<div class="breath"><span id="breath-l">Einatmen</span></div>`:''}<div class="bigtime" id="tm-${kind}">${mmss(timerLeft(r))}</div>
    <div class="row" style="justify-content:center"><button class="btn btn-ghost" data-a="tm-pause" data-k="${kind}">${r.paused!=null?'Weiter':'Pause'}</button><button class="btn btn-ghost" data-a="tm-stop" data-k="${kind}">Abbrechen</button></div></div>`;
}

const TR_TYPES=['Kraft','Laufen','Rad','Schwimmen','Gehen','Mobility','Sport','Andere'];
const TR_INT=['locker','mittel','hart'];
function trainApply(e,sign){
  if(e.type==='Kraft'){if(sign>0)return e.min>=20?bumpLib('workout',1,'check'):null;const left=S.tools.train.some(x=>x!==e&&x.d===e.d&&x.type==='Kraft'&&x.min>=20);if(!left)bumpLib('workout',0,'check');return null}
  if(e.type==='Mobility')return bumpLib('mobility',sign*e.min,'add');
  if(['Laufen','Rad','Schwimmen','Gehen','Sport'].includes(e.type))return bumpLib('cardio',sign*e.min,'add');
  return null;
}

/* ==== 46_arcs.js ==== */

/* ============================================================
   ARCS: jeder Arc ist ein 66-Tage-Programm für eine Kompetenz.
   Arc-Quests (die Gewohnheit) laufen täglich mit, Kapitel kommen
   an Tag 1/4/8/12/16, Prüfung ab Tag 17, Abschluss an Tag 66:
   Prüfung bestanden + Arc-Quests an ≥70 % der Tage.
   ============================================================ */
QLIB.push(
  {lib:'plan',n:'Plan für morgen',stat:'WIL',type:'check',xp:15,desc:'Schreib abends die drei wichtigsten Aufgaben für morgen auf – und einen Wenn-dann-Plan für deine schwierigste Quest.'},
  {lib:'recall',n:'Abruf-Training',stat:'INT',type:'count',unit:'min',tiers:[10,15,20],xp:20,steps:[5],desc:'Frag dich selbst zu deinem Lernstoff ab – ohne Unterlagen. Erst abrufen, dann nachschauen.'},
  {lib:'biz',n:'Business-Schritt',stat:'INT',type:'count',unit:'min',tiers:[15,20,30],xp:25,steps:[5,15],desc:'Arbeite konkret an deinem Projekt: Problem-Gespräche, Angebot, MVP, Verkauf. Handeln statt grübeln.'}
);
for(const L of QLIB.slice(-3))QL[L.lib]=L;
const ARC_Q={erwachen:['plan'],nacht:['wake','nobed'],eisen:['workout','protein'],atem:['cardio','steps'],treibstoff:['protein','water'],klinge:['focus','nomorning'],gedaechtnis:['recall','read'],sturm:['meditate','journal'],klang:['music'],wert:['biz']};
const CH_DAYS=[1,4,8,12,16],EXAM_FROM=17,MIN_RATE=.7,ARC_CH_XP=30,ARC_DONE_XP=500,EXT_DAYS=22;

function AS(){const A=S.arcs||(S.arcs={});for(const [k,v] of Object.entries({active:null,ext:0,ch:[],examPassed:null,examDay:null,done:{},runs:[],chTotal:0}))if(A[k]===undefined)A[k]=Array.isArray(v)?[]:(v&&typeof v==='object'?{}:v);return A}
function arcUnlocked(id){return id==='erwachen'||!!AS().done.erwachen}
function arcDone(id){return !!AS().done[id]}
function arcQuestsFor(d){const id=AS().active;return id?questsFor(d).filter(q=>q.arc===id):[]}
function arcRate(includeToday){
  const A=AS();if(!A.active)return{num:0,den:0,r:0};
  const t=todayKey(),from=Math.max(1,progDay(t)-PDAYS+(includeToday?1:0));let num=0,den=0;
  for(let i=0;i<arcLen();i++){const d=shiftDay(S.start,i);if(d>t||(d===t&&!includeToday))break;if(progDay(d)<from)continue;
    const L=S.log[d];if(L&&L.rest)continue;const qs=arcQuestsFor(d);if(!qs.length)continue;
    const ok=qs.every(q=>qDone(q,d));if(d===t&&!ok)continue;den++;if(ok)num++}
  return{num,den,r:den?num/den:0};
}
function startArc(id,keepStart){
  const A=AS();
  for(const q of S.quests)if(q.arc&&q.arc!==id)delete q.arc;
  const t=todayKey(),cleared=!!(S.log[t]&&S.log[t].bonus>0);
  const prev={};for(const q of S.quests)prev[q.id]=qTier(q,t);
  A.active=id;A.ext=0;A.ch=[];A.examPassed=null;A.examDay=null;
  if(!keepStart){S.start=t;S.evalUntil=shiftDay(t,-1);S.lastPhase=0;S.cycle=(S.cycle||1)+1;for(const q of S.quests)q.tb=prev[q.id]||0}
  A.runs.push({id,start:S.start});
  for(const lib of ARC_Q[id]){let q=S.quests.find(x=>x.lib===lib);
    if(!q){q=makeQuest(lib,S.profile&&S.profile.a);q.since=cleared?shiftDay(t,1):t;S.quests.push(q)}
    q.arc=id;delete q.formed}
}
function finishArcCheck(){
  const A=AS(),a=AI_[A.active],R=arcRate(false),pct=Math.round(R.r*100);
  if(A.examPassed&&R.r>=MIN_RATE){
    A.done[a.id]={d:todayKey(),rate:pct};
    for(const q of S.quests)if(q.arc===a.id){q.formed=a.id;delete q.arc}
    A.active=null;addXP(ARC_DONE_XP,'Arc abgeschlossen: '+a.comp);gainStat(a.stat,3);
    if(!S.titles.includes(a.title))S.titles.push(a.title);
    S.notices.push({type:'sys',tone:'gold',first:true,t:'Kompetenz erworben',lines:[`${a.n} abgeschlossen.`,`${a.comp}: Arc-Quests an ${pct} % der Tage geschafft.`,`+${ARC_DONE_XP} XP · ${STATS[a.stat].n} +3 · Titel: ${a.title}`,`${masterOf(a.id).n}: „${fill(pickSeen(masterOf(a.id).id+':done',masterOf(a.id).done),dvars())}“`,'Die Arc-Quests bleiben als feste Gewohnheit in deinem Plan.','Wähle jetzt deinen nächsten Arc.']});
  }else{
    let n=0;do{A.ext=(A.ext||0)+EXT_DAYS;n++}while(progDay()>arcLen()&&n<40);
    const why=[];if(!A.examPassed)why.push('Die Wissensprüfung ist noch nicht bestanden.');if(R.r<MIN_RATE)why.push(`Arc-Quests an ${pct} % der Tage – nötig sind ${Math.round(MIN_RATE*100)} %.`);
    S.notices.push({type:'sys',tone:'ice',first:true,t:'Arc verlängert',lines:[`${a.n} läuft ${EXT_DAYS*n} Tage weiter – neues Ende: Tag ${arcLen()}.`,...why,'Eine Gewohnheit braucht manchmal länger. Bleib dran – gewertet werden immer die letzten 66 Tage.']});
  }
  checkAch();
}
function chapterState(){
  const A=AS();if(!A.active)return null;const t=todayKey(),pd=progDay(t),n=A.ch.length,a=AI_[A.active];
  if(n<a.ch.length){if(pd<CH_DAYS[n])return{k:'chwait',idx:n,day:CH_DAYS[n]};if(n>0&&A.ch[n-1]>=t)return{k:'chwait',idx:n,day:pd+1};return{k:'chapter',idx:n}}
  if(A.examPassed)return{k:'passed'};
  if(pd<EXAM_FROM||A.ch[n-1]>=t)return{k:'examwait',day:Math.max(EXAM_FROM,pd+1)};
  if(A.examDay===t)return{k:'examfail'};
  return{k:'exam'};
}
function recommendArc(){
  if(!arcDone('erwachen'))return 'erwachen';
  const open=ARCS.filter(a=>!arcDone(a.id)&&a.id!==AS().active);if(!open.length)return null;
  const goals=new Set((S.profile&&S.profile.goals)||[]);
  const gmap={sleep:'nacht',strong:'eisen',fit:'atem',food:'treibstoff',focus:'klinge',learn:'gedaechtnis',calm:'sturm',music:'klang',disc:'erwachen'};
  const fromGoal=open.find(a=>[...goals].some(g=>gmap[g]===a.id));
  const weak=Object.entries(S.stats).sort((x,y)=>x[1]-y[1]).map(x=>x[0]);
  return (fromGoal||weak.map(k=>open.find(a=>a.stat===k)).find(Boolean)||open[0]).id;
}
function arcDots(){const A=AS(),a=AI_[A.active];return `<div class="adots">${a.ch.map((c,i)=>`<i class="${A.ch[i]?'ok':''} ${!A.ch[i]&&i===A.ch.length?'now':''}"></i>`).join('')}<i class="ex ${A.examPassed?'ok':''} ${A.ch.length===a.ch.length&&!A.examPassed?'now':''}"></i></div>`}

function renderArcWindow(){
  const A=AS();

/* ============================================================
   DIALOG: Kapitel als Gespräch mit dem Meister.
   Begegnung (Kapitel 1) → Wissen → Situation (Denkfrage beim
   ersten Fehler, Auflösung nach dem zweiten) → Praxis.
   ============================================================ */
function fill(s,v){return String(s).replace(/\{(\w+)\}/g,(m,k)=>v&&v[k]!=null?v[k]:m)}
function dvars(extra){return Object.assign({name:(S.profile&&S.profile.name)||'du'},extra||{})}
function pickSeen(key,arr){
  if(!arr||!arr.length)return '';if(arr.length===1)return arr[0];
  S.seen=S.seen||{};const last=S.seen[key]||[];let pool=arr.map((_,i)=>i).filter(i=>!last.includes(i));if(!pool.length)pool=arr.map((_,i)=>i);
  const i=pool[Math.floor(rand()*pool.length)];S.seen[key]=[i,...last].slice(0,Math.max(1,Math.min(4,arr.length-1)));return arr[i];
}
const ABBR=['z. B.','d. h.','u. a.','v. a.','z. T.','bzw.','ca.','etc.','evtl.','ggf.','usw.','Dr.','Nr.','min.','max.','inkl.','vs.'];
function sentences(txt){
  let t=String(txt);ABBR.forEach((a,i)=>{t=t.split(a).join('\u0001'+i+'\u0002')});
  const out=[];let cur='';
  for(let i=0;i<t.length;i++){const ch=t[i];cur+=ch;
    if('.!?…'.includes(ch)){let j=i+1;while(j<t.length&&'"“”»)'.includes(t[j])){cur+=t[j];j++}
      if(j<t.length&&t[j]===' '){let k=j;while(k<t.length&&t[k]===' ')k++;if(k<t.length&&/[A-ZÄÖÜ„"(0-9]/.test(t[k])){out.push(cur.trim());cur='';i=k-1;continue}}
      i=j-1}}
  if(cur.trim())out.push(cur.trim());
  return out.map(x=>x.replace(/\u0001(\d+)\u0002/g,(m,i)=>ABBR[+i]));
}
function groupSentences(ss){const g=[];let cur='';for(const s of ss){if(!cur){cur=s;continue}if(cur.length+s.length<190){cur+=' '+s}else{g.push(cur);cur=s}}if(cur)g.push(cur);return g}
function nextChips(){const a=[...NEXT_CHIPS];const out=[];while(out.length<2&&a.length){out.push(a.splice(Math.floor(rand()*a.length),1)[0])}return out}

function buildLesson(arcId,idx,review){
  const a=AI_[arcId],c=a.ch[idx],M=masterOf(arcId),v=dvars({t:c.t,arc:a.n,comp:a.comp,m:M.n});const st=[];
  const say=(w,t,cls)=>st.push({w,t:fill(t,v),cls});
  if(idx===0&&!review)for(const x of M.meet){if(x[0]==='u')st.push({u:x[1].map(o=>Array.isArray(o)?[fill(o[0],v),o[1],fill(o[2],v)]:[fill(o,v)])});else say(x[0],x[1])}
  say('m',pickSeen(M.id+':open',M.open));
  const groups=groupSentences(sentences(c.learn));
  groups.forEach((g,i)=>{if(i>0){st.push({u:nextChips().map(x=>[x])});if(i===1&&M.mid)say('m',pickSeen(M.id+':mid',M.mid))}say('m',g)});
  st.push({u:nextChips().map(x=>[x])});
  say('m',pickSeen(M.id+':sit',M.sit));say('m',c.sit.q,'q');
  st.push({sit:true});
  say('m',pickSeen(M.id+':task',M.task));say('m',c.task,'box');
  st.push({end:true});
  return st;
}
function dlgKey(id,idx,review){return id+':'+idx+(review?':r':'')}
function openLesson(arcId,idx,review){
  const k=dlgKey(arcId,idx,review);ui.dlgCache=ui.dlgCache||{};
  let D=ui.dlgCache[k];
  if(!D||D.date!==todayKey()||D.closed){D={key:k,arc:arcId,idx,review,date:todayKey(),steps:buildLesson(arcId,idx,review),pos:0,log:[],queue:[],wait:null,typing:false,sit:{tries:0,picked:[],solved:false,revealed:false},order:shuffledIdx(AI_[arcId].ch[idx].sit.o.length,arcId+idx+todayKey())};ui.dlgCache[k]=D;dlgAdvance(D)}
  ui.dlg=D;ui.sheet={type:'dlg'};render();dlgPump();
}
function dlgAdvance(D){
  while(D.pos<D.steps.length){const s=D.steps[D.pos];
    if(s.w){D.queue.push({w:s.w,t:s.t,cls:s.cls});D.pos++;continue}
    D.wait=s;return}
  D.wait=null;
}
function typeDelay(t){return Math.min(1500,380+String(t).length*13)}
function dlgPump(){
  const D=ui.dlg;if(!D||D.typing||!D.queue.length)return;
  if(!ui.sheet||ui.sheet.type!=='dlg')return;
  D.typing=true;render();
  const next=D.queue[0];
  D.timer=setTimeout(()=>{if(ui.dlg!==D)return;D.typing=false;const m=D.queue.shift();if(m){m.at=Date.now();D.log.push(m)}
    if(ui.sheet&&ui.sheet.type==='dlg'){render();setTimeout(dlgPump,D.queue.length?120:0)}},typeDelay(next.t));
}
function dlgFlush(D){if(!D)return;clearTimeout(D.timer);D.typing=false;while(D.queue.length){const m=D.queue.shift();m.at=0;D.log.push(m)}}
ACTIONS['dlg-skip']=()=>{const D=ui.dlg;if(!D||!D.queue.length&&!D.typing)return;dlgFlush(D);render()};
ACTIONS['dlg-chip']=ds=>{const D=ui.dlg;if(!D||D.queue.length||D.typing||!D.wait||!D.wait.u)return;const o=D.wait.u[+ds.i];if(!o)return;
  D.log.push({w:'u',t:o[0],at:Date.now()});if(o[2])D.queue.push({w:o[1]||'m',t:o[2]});D.pos++;D.wait=null;dlgAdvance(D);render();dlgPump()};
ACTIONS['dlg-pick']=ds=>{const D=ui.dlg;if(!D||D.queue.length||D.typing||!D.wait||!D.wait.sit)return;
  const a=AI_[D.arc],c=a.ch[D.idx],M=masterOf(D.arc),s=D.sit,o=+ds.o;if(s.picked.includes(o))return;
  D.log.push({w:'u',t:c.sit.o[o],at:Date.now()});
  if(o===c.sit.a){s.solved=true;D.queue.push({w:'m',t:pickSeen(M.id+':right',M.right)},{w:'m',t:c.sit.why,cls:'why'});D.pos++;D.wait=null;dlgAdvance(D)}
  else{s.picked.push(o);s.tries++;
    if(s.tries>=2){s.revealed=true;D.queue.push({w:'m',t:pickSeen(M.id+':reveal',M.reveal)},{w:'m',t:'„'+c.sit.o[c.sit.a]+'“ – '+c.sit.why,cls:'why'});D.pos++;D.wait=null;dlgAdvance(D)}
    else D.queue.push({w:'m',t:pickSeen(M.id+':wrong',M.wrong)},{w:'m',t:pickSeen(M.id+':hint',M.hint)+' '+c.sit.hint,cls:'hint'})}
  render();dlgPump()};
ACTIONS['dlg-done']=()=>{const D=ui.dlg;if(!D||D.queue.length||D.typing||!D.wait||!D.wait.end)return;
  if(D.review){D.closed=true;ui.sheet={type:'arc',id:D.arc};ui.dlg=null;render();return}
  if(!completeChapter(D))return;
  const M=masterOf(D.arc);D.log.push({w:'u',t:'Erledigt!',at:Date.now()});D.queue.push({w:'m',t:fill(pickSeen(M.id+':bye',M.bye),dvars())});D.wait={close:true};D.closed=true;save();render();dlgPump()};
ACTIONS['dlg-close']=()=>{const D=ui.dlg;dlgFlush(D);ui.sheet=null;ui.dlg=null;render()};
function completeChapter(D){
  const A=AS(),a=AI_[D.arc],t=todayKey(),st=chapterState();if(!st||st.k!=='chapter'||st.idx!==D.idx||A.active!==D.arc)return false;
  A.ch.push(t);A.chTotal=(A.chTotal||0)+1;const bonus=D.sit.solved&&D.sit.tries===0?10:0;const xp=ARC_CH_XP+bonus;
  addXP(xp,`${a.n}: ${a.ch[D.idx].t}`);gainStat(a.stat,1);

function planMinutes(c,min){const out=[];const v={min};
  out.push(J('grin',fill(pickSeen('c:timeYes',CT.timeYes),v)));
  if(!c.open.length){out.push(J('proud',c.cleared?"Aber deine Quests sind schon erledigt. Nutz die Zeit für Erholung – oder für eine Lektion, falls eine wartet.":"Heute steht nichts an. Nutz die Zeit für dich."));return out}
